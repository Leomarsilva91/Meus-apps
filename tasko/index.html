<style>

header.top .hb{background:none;border:0;color:#fff;min-width:46px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:12px;padding:2px 3px;font:inherit}.hb span{font-size:10px;line-height:1.1;font-weight:600}.hb[aria-pressed=true]{background:rgba(255,255,255,.22)}.hb svg{display:block}header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px}

details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}details>summary::after{content:'+';display:inline-block;margin-left:8px;font-weight:800;font-size:1.15em;line-height:1}details[open]>summary::after{content:'\2212'}header.top .hb{position:relative}header.top .hb:not([data-p=perfil])::after{content:'+';position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font:800 13px/15px sans-serif;text-align:center}header.top .hb[aria-pressed=true]:not([data-p=perfil])::after{content:'\2212'}
details.mm{width:100%}details.mm>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box}details.mm>summary::-webkit-details-marker{display:none}.menu .btn.ghost{background:var(--pri);color:#fff;border:0}
.btn.sos{background:var(--acc);color:#14213D}

.link{background:none;border:0;color:var(--link);min-height:44px;text-decoration:underline}
.muted{color:var(--muted);font-size:14px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}.rcol{display:flex;flex-direction:column;gap:12px}.rcol h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,inherit);opacity:.8}.rcol .pick{flex:1;padding:14px 12px}.rcol .pick b{font-size:16px}.rtg2{display:block;font-size:10px;font-weight:600;opacity:.85;line-height:1.2;margin-top:1px}.rtg{display:flex!important;flex-wrap:wrap;gap:4px;margin:4px 0 2px!important}.rtg i{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.5;color:var(--link)}.pick[aria-pressed=true] .rtg i{color:#fff}.pick{text-align:left;width:100%;min-height:80px;border:2px solid var(--link);border-radius:16px;background:var(--card);color:var(--ink);padding:16px 20px}
.pick b{display:block;font-size:18px;color:var(--link)}
.pick span{display:block;margin-top:4px}
.pick[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.pick[aria-pressed=true] b,.pick[aria-pressed=true] span{color:#fff}
label{font-size:14px;font-weight:700;display:block;margin-bottom:6px}

.err:empty{display:none}
textarea{min-height:120px;resize:vertical}
input[aria-invalid=true],textarea[aria-invalid=true]{border:2px solid var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--link);background:var(--card);color:var(--link);font-size:14px}
.chip.fill{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.chip[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;padding:6px 12px;border-radius:16px;background:var(--line);font-size:14px}
.plan{display:flex;flex-direction:column;gap:2px}
.plan .pr{font-size:22px;font-weight:700}
.plan .tg{align-self:flex-start;margin-bottom:6px;font-size:12px;padding:3px 10px;border-radius:12px;background:var(--accbg);color:var(--ink);border:1px solid var(--acc)}
.pick[aria-pressed=true] .tg{background:#fff;color:#14213D}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.pts{font-size:40px;font-weight:700;line-height:1}
.inc{list-style:none;padding:0!important;margin:10px 0 0}
.inc li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.inc li::before{content:"\2713";color:var(--link);font-weight:700}
.inc li.no{color:var(--muted)}.inc li.no::before{content:"\2013";color:var(--muted)}
.rw{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .chip{flex:none}
.xgh{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:56px;background:none;border:0;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer}.xgh>span:first-child{display:flex;flex-direction:column;gap:2px}.xgh b{font-size:17px}
.tk{flex-wrap:wrap;display:flex;gap:14px;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:14px;margin-top:10px}.tk .ic{font-size:34px;line-height:1;flex:none}.tk .bd{flex:1;min-width:0}.tk .bd b{font-size:16px;display:block}.tk.lock{opacity:.7}
.est{background:var(--accbg);border:1px solid var(--acc);border-radius:16px;padding:16px}
.est strong{display:block;font-size:26px;margin:4px 0}
.card ul{margin:8px 0 0;padding-left:20px}
.sum{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.vlink{display:flex;align-items:center;min-height:44px;color:var(--link);font-weight:700;overflow-wrap:anywhere}
.doc{background:#fff;color:#14213D;border:1px solid #DCE3E1;border-radius:8px;padding:20px;font-size:14px;line-height:1.5}
.doc h2{margin:0 0 2px;font-size:18px}
.doc hr{border:0;border-top:1px solid #DCE3E1;margin:12px 0}
.doc .big{font-size:26px;font-weight:700}
.doc .note{font-size:12px;color:#4A5957}
.doc .li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:13px;margin-top:6px}
.doc .li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{color:var(--bad);font-weight:700;min-height:0}
.alert:empty{display:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button,a,select,summary,label.chk{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card{content-visibility:auto;contain-intrinsic-size:auto 140px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (max-width:350px){header.top{gap:2px;padding-left:10px;padding-right:8px}header.top h1{font-size:20px}header.top .hb{min-width:38px;padding:2px 1px}header.top .hb span{font-size:9px}header.top .hb svg{width:22px;height:22px}header.top .gear{min-width:38px;padding:0 4px}}
@media (max-width:430px){header.top.pro{padding-left:12px;padding-right:8px;gap:4px}header.top.pro .gear{min-width:38px;padding:0 3px}header.top.pro .hb{min-width:36px}header.top.pro .hb span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (max-width:350px){header.top.pro .hb{min-width:34px}header.top.pro .hb svg{width:20px;height:20px}header.top.pro .gear{min-width:34px;padding:0 2px}}
@media (max-width:330px){header.top.pro{padding-left:8px;padding-right:4px;gap:2px}header.top.pro h1{font-size:17px}header.top.pro .hb{min-width:32px}header.top.pro .gear{min-width:32px}}
details *,details *::before,details *::after{box-sizing:border-box}
.hmbtn{margin-left:auto;background:none;border:0;color:#fff;min-width:48px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border-radius:12px;font:inherit}.hmbtn span{font-size:10px;line-height:1}header.top h1{min-width:0;overflow-wrap:anywhere}
.brandcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}.brandcol h1{margin:0}.sairbtn{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:99px;padding:3px 12px;min-height:30px;font-weight:600;font-size:13px;line-height:1;font-family:inherit;cursor:pointer}
#sairdlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}.sairbg{position:absolute;inset:0;background:rgba(10,18,40,.6)}.sairbox{position:relative;background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}.sairbox h2{margin:0;font-size:21px}.sairbox p{margin:0;color:var(--muted)}

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2457d6"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tasko"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"></head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const _store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}}}})();
const SYNCK={ms_fb:1,ms_requests:1,ms_proposals:1,ms_msgs:1,ms_users:1,ms_plans:1,ms_jobs:1,ms_rec:1,ms_lists:1,ms_rates:1,ms_cfg:1,ms_reports:1};
const SY={db:null,on:false,sent:{},q:Promise.resolve(),tm:{}};
const rawSet=(k,v)=>_store.setItem(k,v);
const syId=(k,x)=>String(k==='ms_users'||k==='ms_plans'?x.email:x.id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,180);
const syStrip=(k,x)=>{if(k!=='ms_users')return x;const y={...x};delete y.h;delete y.consent;delete y.cpf;return y};
const syRead=k=>{try{const v=JSON.parse(_store.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}};
function syPush(k){if(!SY.db||!SYNCK[k])return;clearTimeout(SY.tm[k]);SY.tm[k]=setTimeout(()=>{SY.q=SY.q.then(async()=>{try{
  const L=syRead(k).filter(x=>x&&(k==='ms_users'||k==='ms_plans'?x.email:x.id!=null)&&!x.sample),sent=SY.sent[k]=SY.sent[k]||{},ids={};
  for(const x of L){const id=syId(k,x),j=JSON.stringify(syStrip(k,x));ids[id]=1;if(sent[id]===j)continue;await SY.db.doc('sync_'+k+'/'+id).set({j,t:Date.now()});sent[id]=j}
  for(const id of Object.keys(sent)){if(!ids[id]){delete sent[id];await SY.db.doc('sync_'+k+'/'+id).delete()}}
SY.rt=0}catch(e){SY.rt=(SY.rt||0)+1;if(SY.rt<=6)setTimeout(()=>syPush(k),4000*SY.rt)}})},350)}
const store={getItem:k=>_store.getItem(k),removeItem:k=>_store.removeItem(k),setItem:(k,v)=>{try{_store.setItem(k,v)}catch(e){storeFull();throw e}if(SYNCK[k])syPush(k)}};
function storeFull(){if(document.getElementById('fullbar'))return;const d=document.createElement('div');d.id='fullbar';d.setAttribute('role','alert');d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:var(--bad);color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)';d.innerHTML='<b>A memória do aparelho para o app está cheia.</b> Suas últimas alterações podem não ter sido salvas. Libere espaço apagando gastos, vídeos ou pedidos antigos, ou baixe seus dados em Privacidade e dados. <button type="button" style="margin-top:8px;display:block;background:#fff;color:#14213D;border:0;border-radius:10px;padding:8px 14px;font-weight:700">Entendi</button>';d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
function syApply(k,snap){const sent=SY.sent[k]=SY.sent[k]||{};let L=syRead(k),ch=false;
  const keyOf=x=>syId(k,x);
  for(const c of snap.docChanges()){
    if(c.doc.metadata&&c.doc.metadata.hasPendingWrites)continue;
    const id=c.doc.id;
    if(c.type==='removed'){const n=L.filter(x=>x&&keyOf(x)!==id);if(n.length!==L.length&&sent[id]!==undefined){L=n;ch=true}delete sent[id];continue}
    const d=c.doc.data(),j=d&&d.j;if(!j||sent[id]===j)continue;
    let r;try{r=JSON.parse(j)}catch(e){continue}
    const i=L.findIndex(x=>x&&keyOf(x)===id);sent[id]=j;
    if(i<0){L.push(r)}else{const o=L[i];
      if(k==='ms_users')L[i]={...o,...r};
      else if(k==='ms_msgs')L[i]={...r,seen:[...new Set([...(r.seen||[]),...(o.seen||[])])]};
      else L[i]=r}
    ch=true}
  if(ch){rawSet(k,JSON.stringify(L));SY.last=Date.now();syPush(k);if(typeof syncNotify==='function')syncNotify(k)}}
async function syInit(){try{if(!window.claude||!claude.use)return;const db=await claude.use('db');if(!db)return;SY.db=db;
  for(const k of Object.keys(SYNCK)){db.collection('sync_'+k).onSnapshot(sn=>{SY.on=true;syApply(k,sn);if(!SY['i'+k]){SY['i'+k]=1;syPush(k)}},()=>{SY.on=false})}
}catch(e){}}
const migrate=u=>{if(!u.roles)u={name:u.name,email:u.email,phone:u.phone,h:u.h,roles:u.role==='pro'?{pro:{cat:u.cat||'',city:u.city||''}}:{cli:1},last:u.role};const R=u.roles;
  if(R.cli&&typeof R.cli==='object'&&R.cli.emp){R.cliE={razao:R.cli.emp.razao,cnpj:R.cli.emp.cnpj};delete R.cli;if(u.last==='cli')u.last='cliE'}
  if(R.pro&&R.pro.emp){R.proE={...R.pro,razao:R.pro.emp.razao,cnpj:R.pro.emp.cnpj};delete R.proE.emp;delete R.pro;if(u.last==='pro')u.last='proE'}
  return u};
const users=()=>{try{const l=JSON.parse(store.getItem('ms_users')||'[]');return Array.isArray(l)?l.map(migrate):[]}catch(e){return[]}};
const saveUsers=l=>store.setItem('ms_users',JSON.stringify(l));
const view=(u,k)=>{const b=String(k).replace('E',''),isE=k!==b,own=u.roles[k]&&typeof u.roles[k]==='object'?u.roles[k]:{},pd=b==='pro'?own:(u.roles.pro&&typeof u.roles.pro==='object'?u.roles.pro:(u.roles.proE||{}));return{emp:isE?{razao:own.razao||'',cnpj:own.cnpj||''}:null,name:u.name,email:u.email,phone:u.phone,roles:u.roles,role:b,pk:k,kind:(b==='pro'&&!isE)?(own.kind||''):'',cat:pd.cat||'',title:pd.title||'',area:pd.area||'',city:pd.city||''}};
const pickRole=u=>u.roles[u.last]?u.last:(RKEYS.find(k=>u.roles[k])||'cli');
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const KINDS=[['mei','MEI (microempreendedor individual)'],['aut','Autônomo (contribuinte individual)'],['par','Particular (serviços eventuais)']],KL={mei:'MEI',aut:'Autônomo',par:'Particular'};
const kindSel=(id,cur)=>`<div><label for="${id}">Como você atua</label><select id="${id}" aria-describedby="e-${id}"><option value="">Selecione</option>${KINDS.map(k=>`<option value="${k[0]}"${cur===k[0]?' selected':''}>${k[1]}</option>`).join('')}</select><div class="err" id="e-${id}"></div></div>`;
const CATS=['Elétrica','Hidráulica','Limpeza','Pintura','Construção e reformas','Outros serviços'];
const ROLE={cli:'Contratante',pro:'Profissional',cliE:'Contratante (empresa)',proE:'Prestador (empresa)'},RKEYS=['cli','pro','cliE','proE'],RTAG={cli:'Individual · Particular',pro:'MEI · Ind. · Particular'};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
const S={v:'welcome',role:null,user:null};

const OUT='Outros serviços',areaFld=(sel,val,cat)=>`<div id="${sel}ab"${cat===OUT?'':' hidden'}>${fld(sel+'ar','Qual é a sua área de atuação?','type="text" maxlength="60" placeholder="Ex.: Fotografia de eventos, aulas de violão, conserto de celulares" value="'+esc(val||'')+'"')}</div>`;
const fld=(id,lab,attrs,extra='')=>`<div><label for="${id}">${lab}</label><input id="${id}" ${attrs} aria-describedby="e-${id}">${extra}<div class="err" id="e-${id}"></div></div>`;
const head=(t,back)=>`<header class="top">${back?`<button class="back" data-act="back" data-bk="${back}" aria-label="Voltar">←</button>`:''}<h1>${t}</h1>${back&&!['welcome','login'].includes(back)?`<button class="hmbtn" data-go="home" aria-label="Página inicial" title="Página inicial"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg><span>Início</span></button>`:''}</header>`;

const V={
welcome:()=>`<div class="hero"><svg width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="Logo do Tasko" style="display:block;margin-bottom:16px"><rect width="64" height="64" rx="18" fill="#FF6B35"/><path d="M17 22H47M32 22V43" stroke="#FFF7EC" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="46" cy="46" r="6.5" fill="#2EC4A6"/></svg><h1>tasko</h1><p style="margin:0">Encontre quem resolve ou ofereça o seu trabalho.</p></div>
<main>

${S.role.startsWith('pro')?cpfProFld(S.role==='proE'):''}${S.role==='pro'?kindSel('kind',''):''}

${fld('city','Cidade de atuação','type="text" autocomplete="address-level2"')}`:''}

<button class="btn" id="go" type="submit" data-act="signup">Criar conta</button></form>
<button class="link" data-go="login">Já tenho conta</button></main>`,
reset:()=>{const R=S.rs||{};return `${head('Recuperar senha','login')}<main><form class="pf" id="rform" autocomplete="on" style="display:contents">
<div class="card"><b>Código enviado para ${esc(R.email||'')}</b><p class="muted" style="margin:6px 0 0">Ele vale por 10 minutos. Digite o código e escolha uma nova senha.</p><div style="margin-top:10px;padding:10px;border-radius:12px;background:var(--line)" role="note"><b>Demonstração:</b> o app ainda não envia e-mails de verdade. O código que chegaria no seu e-mail é <b style="letter-spacing:.15em">${esc(R.code||'')}</b>.</div></div>
<input type="email" name="username" autocomplete="username" value="${esc(R.email||'')}" hidden>
${fld('rcode','Código de 6 dígitos','type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"')}
${fld('rpw','Nova senha','type="password" name="password" autocomplete="new-password"','<div class="muted" id="rpwm" aria-live="polite"></div>')}
${fld('rpw2','Confirmar nova senha','type="password" autocomplete="new-password"')}
<label class="chk"><input type="checkbox" data-act="showpw"> Mostrar senhas</label>
<div class="alert" id="rerr" role="alert"></div>
<button class="btn" id="go" type="submit" data-act="doreset">Salvar nova senha</button></form></main>`},
login:()=>`${head('Entrar','welcome')}<main><form class="pf" id="lform" autocomplete="on" style="display:contents">
${fld('lemail','E-mail','type="email" name="username" autocomplete="username" inputmode="email"')}
${fld('lpw','Senha','type="password" name="password" autocomplete="current-password"')}
<label class="chk"><input type="checkbox" data-act="showpw"> Mostrar senha</label>
<div class="alert" id="lerr" role="alert"></div><div class="muted" id="lmsg" aria-live="polite"></div>
<button class="btn" id="go" type="submit" data-act="login">Entrar</button></form>
<button class="link" data-act="forgot">Esqueci minha senha</button>
<button class="btn ghost" data-go="welcome">Criar uma conta</button></main>`,
request:()=>{const r=S.req,pd=pendEm();if(!r.city)r.city=lastCity();if(pd)return `${head('Descrição do serviço','home')}<main><div class="card"><h2>Antes de um novo pedido</h2><p style="margin:8px 0 0">Falta pagar a taxa do seu pedido de emergência. Leva um minuto e depois você pode pedir normalmente.</p><button class="btn" style="margin-top:12px" data-unlock="${pd.id}">Pagar a taxa pendente</button></div></main>`;return `${head('Descrição do serviço','home')}<main>
<div><label for="rdesc">O que você precisa?</label><textarea id="rdesc" aria-describedby="e-rdesc" maxlength="2000" placeholder="Pode ser um reparo ou uma obra. Ex.: o chuveiro não esquenta; ou: construir um muro de 20 m; ou: reformar a casa inteira, 120 m²">${esc(r.desc)}</textarea><div class="err" id="e-rdesc"></div><div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button type="button" class="chip" id="dictbtn" data-act="dict">🎤 Falar a descrição</button><button type="button" class="chip" data-say="form">🔊 Ouvir</button></div><div class="muted" id="dictmsg" role="status" aria-live="polite" style="margin-top:4px"></div></div>
<div id="emsug" aria-live="polite">${emSugHtml()}</div>
<div><label for="rurg">Quando você precisa?</label><select id="rurg">${URG.map(([k,l])=>`<option value="${k}"${r.urg===k?' selected':''}>${l}</option>`).join('')}</select></div>
${fld('rcity','Bairro ou cidade do serviço','type="text" autocomplete="address-level2" value="'+esc(r.city)+'"')}
${projPickHtml(r)}
<div><button class="chip" data-act="getloc">${r.loc?'Localização obtida':'Usar minha localização'}</button><span id="locmsg" class="muted" style="display:block;margin-top:4px">${r.loc?'Ela só é enviada se você pedir ajuda de emergência.':'Opcional. Ajuda o app a perceber se é uma emergência.'}</span></div>
<input class="sr" type="file" id="rvcam" accept="video/*" capture="environment" tabindex="-1" aria-label="Gravar vídeo do serviço"><input class="sr" type="file" id="rvgal" accept="video/*" tabindex="-1" aria-label="Escolher vídeo da galeria"><div id="rvbox">${rvBox(r)}</div>
<button class="btn ghost" id="an" data-act="analyze">Analisar descrição com IA (opcional)</button>
<div id="ai" aria-live="polite" style="display:flex;flex-direction:column;gap:14px">${aiHtml()}</div>
${prefBanner()}${hotCard()}<p class="muted" style="margin:0">Taxa da plataforma: <b>${fee()}</b>. Você publica agora e paga quando algum profissional quiser negociar. A conversa só abre depois do pagamento.</p>
<button class="btn" id="pub" data-act="publish">Publicar pedido</button></main>`},
earnings:()=>{const e=S.ep;return `${head('Meus ganhos','home')}<main>
<div><label for="eper">Período</label><select id="eper">${PERS.map(([k,l])=>`<option value="${k}"${e.per===k?' selected':''}>${l}</option>`).join('')}</select></div>
${e.per==='c'?`<div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label for="efrom">De</label><input id="efrom" type="date" value="${esc(e.from)}"></div><div style="flex:1"><label for="eto">Até</label><input id="eto" type="date" value="${esc(e.to)}"></div></div>`:''}
<div id="eout" aria-live="polite" style="display:flex;flex-direction:column;gap:14px">${eoutHtml()}</div>
<button class="btn" data-go="stmt">Gerar demonstrativo</button>
<button class="btn ghost" data-act="seed">${jobs().some(j=>j.sample)?'Remover serviços de exemplo':'Gerar serviços de exemplo'}</button></main>`},
stmt:()=>{const r=range();if(!r)return V.earnings();const s=stats(r);
if(!s.n)return `${head('Demonstrativo de ganhos','earnings')}<main><div class="card"><b>Nenhum serviço concluído neste período</b><p class="muted" style="margin:6px 0 0">Escolha outro período para gerar o demonstrativo.</p></div></main>`;
return `${head('Demonstrativo de ganhos','earnings')}<main>
<div class="doc"><h2>Demonstrativo de ganhos na plataforma</h2><div class="note">Tasko</div><hr>
${srow('Profissional','<b>'+esc(S.user.name)+'</b>')}${srow('Categoria',esc(S.user.cat))}${srow('Período',esc(r.text))}${srow('Gerado em',esc(new Date().toLocaleString('pt-BR')))}
<hr><div class="note">Média por serviço prestado</div><div class="big">${brl2(s.avg)}</div><div class="note">${s.n} ${s.n===1?'serviço':'serviços'} no período</div>
<hr>${srow('Total recebido',brl2(s.total))}${srow('Custo de material',brl2(s.mats))}${srow('Ganho líquido',brl2(s.net),1)}${srow('Média líquida por serviço',brl2(s.avgNet))}${s.perHour!=null?srow('Valor líquido por hora',brl2(s.perHour)+'/h'):''}${r.months>1?srow('Média por mês',brl2(s.avgMonth)):''}
${s.months.length>1?'<hr><b>Por mês</b>'+s.months.map(x=>srow(esc(cap(MES[x.m]))+' '+x.y+' · '+x.n,brl2(x.total)+' (média '+brl2(x.total/x.n)+')')).join(''):''}
<hr><b>Serviços do período</b>${s.L.map(j=>`<div class="li"><span>${dd(new Date(j.at))}</span><span>${esc(String(j.desc||''))}${j.sample?' (exemplo)':''}</span><span>${brl2(j.price)}</span></div>`).join('')}
<hr><div class="note">${esc(NOTE)}${s.sample?' Este documento inclui serviços de exemplo.':''}</div></div>
<button class="btn" data-act="pdf">Baixar PDF</button>
<button class="btn ghost" data-act="csv">Baixar planilha (CSV)</button>
<div class="alert" id="dlmsg" role="alert"></div></main>`},
addpro:()=>`${head('Adicionar perfil de profissional','home')}<main>
${cpfNeed()?cpfProFld(false):''}${kindSel('kind','')}
<div><label for="cat">Sua categoria</label><select id="cat" aria-describedby="e-cat"><option value="">Selecione</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="err" id="e-cat"></div></div>${areaFld('cat','','')}
${fld('city','Cidade de atuação','type="text" autocomplete="address-level2"')}
<button class="btn" data-act="addpro">Adicionar perfil</button></main>`,
addemp:()=>{const k=S.addk||'cliE',isP=k==='proE';return `${head('Adicionar perfil: '+ROLE[k].toLowerCase(),'home')}<main>
<p class="muted" style="margin:0">Fica na mesma conta, ao lado dos outros perfis.</p>
${fld('razao','Razão social','type="text" autocomplete="organization"')}${fld('cnpj','CNPJ','type="text" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00"')}
${isP&&cpfNeed()?cpfProFld(true):''}${isP?`<div><label for="cat">Categoria</label><select id="cat" aria-describedby="e-cat"><option value="">Selecione</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="err" id="e-cat"></div></div>${areaFld('cat','','')}${fld('city','Cidade de atuação','type="text" autocomplete="address-level2"')}`:''}
<button class="btn" data-act="addemp">Adicionar perfil</button></main>`},
mine:()=>mineV(false),minedone:()=>mineV(true),hist:()=>histV(),
feedmenu:()=>`${head('Vídeos de serviços','home')}<main>
<button class="btn" data-go="workers">Procurar vídeos de um trabalhador</button>
<button class="btn ghost" data-go="feed">Ver todos os vídeos</button></main>`,
workers:()=>`${head('Procurar trabalhador','feedmenu')}<main>
${fld('fq','Nome do trabalhador','type="search" autocomplete="off" placeholder="Digite o nome" value="'+esc(S.fq||'')+'"')}
<div id="wlist">${workersList()}</div></main>`,
feed:()=>{const w=S.user.role!=='pro'&&S.fw?workerOf(S.fw):null;return `${head(w?'Vídeos de '+String(w.name).split(' ')[0]:'Vídeos de serviços',S.user.role==='pro'?'home':(w?'workers':'feedmenu'))}<main>
${S.user.role==='pro'?'<button class="btn" data-go="record">Filmar meu serviço</button><button class="btn ghost" data-go="spot">Destacar meus vídeos</button>':''}
<div id="flist">${feedList()}</div></main>`},
spend:()=>{const P=projs(),X=exps(),tot=l=>l.reduce((a,x)=>a+x.amount,0),loose=X.filter(x=>!P.some(p=>p.id===x.projId));return `${head('Gastos e planilhas','home')}<main>
<p class="muted" style="margin:0">Organize o que você gasta com serviços em projetos e emita planilhas e relatórios quando quiser.</p>
${autoCard()}
<div class="card"><b>Novo projeto</b>${fld('spname','Nome do projeto','type="text" maxlength="50" placeholder="Ex.: Reforma do apartamento" value="'+esc(SP().name)+'"')}<button class="btn" style="margin-top:10px" data-act="spnew">Criar projeto</button></div>
<h2 style="margin:4px 0 0">Seus projetos</h2>
${P.length||loose.length?P.map(p=>{const l=X.filter(x=>x.projId===p.id);return `<button class="card" style="width:100%;text-align:left;cursor:pointer" data-proj="${p.id}"><b>${esc(p.name)}</b><p class="muted" style="margin:4px 0 0">${l.length} ${l.length===1?'gasto':'gastos'} · ${brl2(tot(l))}</p></button>`}).join('')+(loose.length?`<button class="card" style="width:100%;text-align:left;cursor:pointer" data-proj="-1"><b>Gastos sem projeto</b><p class="muted" style="margin:4px 0 0">${loose.length} ${loose.length===1?'gasto':'gastos'} · ${brl2(tot(loose))}</p></button>`:''):'<div class="card"><b>Nenhum projeto ainda</b><p class="muted" style="margin:6px 0 0">Crie um projeto acima ou registre um gasto avulso.</p></div>'}
<button class="btn" data-act="spaddto" data-p="0">Registrar gasto</button>
<button class="btn ghost" data-act="sprepall">Emitir planilha ou relatório</button></main>`},
projview:()=>{const id=SP().proj,P=projs().find(p=>p.id===id),X=exps().filter(x=>id===-1?!projs().some(p=>p.id===x.projId):x.projId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
if(id!==-1&&!P)return V.spend();const t=X.reduce((a,x)=>a+x.amount,0);return `${head(id===-1?'Gastos sem projeto':esc(P.name),'spend')}<main>
<div class="card"><p class="muted" style="margin:0">Total gasto</p><h2 style="margin:4px 0 0">${brl2(t)}</h2><p class="muted" style="margin:4px 0 0">${X.length} ${X.length===1?'gasto':'gastos'}</p></div>
${X.length>1?(()=>{const g=new Map();X.forEach(x=>g.set(x.cat,(g.get(x.cat)||0)+x.amount));return `<div class="card"><b>Resumo automático por tipo</b>${[...g].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sum"><span>${esc(k)}</span><b>${brl2(v)}</b></div>`).join('')}</div>`})():''}
${X.length?X.map(x=>`<div class="card">${spItem(x)}<button class="chip" style="margin-top:10px" data-spdel="${x.id}">Excluir</button></div>`).join(''):'<div class="card"><b>Sem gastos neste projeto</b><p class="muted" style="margin:6px 0 0">Registre o primeiro gasto abaixo.</p></div>'}
<button class="btn" data-act="spaddto" data-p="${id===-1?0:id}">Registrar gasto${id===-1?'':' neste projeto'}</button>
<button class="btn ghost" data-act="sprepproj">Emitir relatório ${id===-1?'destes gastos':'deste projeto'}</button>
${id===-1?'':'<button class="btn ghost" data-act="spdelproj">Excluir projeto</button>'}</main>`},
spadd:()=>{const f=SP().f,P=projs(),R=jget('ms_requests').filter(q=>q&&q.email===S.user.email&&q.desc).sort((a,b)=>b.id-a.id);return `${head('Registrar gasto',SP().proj?'projview':'spend')}<main>
${fld('spdesc','O que foi pago','type="text" maxlength="80" placeholder="Ex.: Instalação das tomadas" value="'+esc(f.desc)+'"')}
${fld('spval','Valor (R$)','type="text" inputmode="decimal" placeholder="0,00" value="'+esc(f.val)+'"','<p class="muted" style="margin:4px 0 0">Use vírgula para os centavos.</p>')}
${fld('spdate','Data do gasto','type="date" value="'+esc(f.date)+'"')}
<div><label for="spcat">Tipo de gasto</label><select id="spcat">${SPCATS.map(c=>`<option${f.cat===c?' selected':''}>${c}</option>`).join('')}</select></div>
<div><label for="spproj">Projeto</label><select id="spproj"><option value="0">Sem projeto</option>${P.map(p=>`<option value="${p.id}"${f.proj===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
<div><label for="spreq">Serviço pedido (opcional)</label><select id="spreq"><option value="0">Nenhum</option>${R.map(q=>`<option value="${q.id}"${f.req===q.id?' selected':''}>${esc(String(q.desc).slice(0,45))}</option>`).join('')}</select></div>
<button class="btn" data-act="spsave">Salvar gasto</button></main>`},
sprep:()=>{const rp=SP().rp,P=projs(),X=exps(),hasLoose=X.some(x=>!P.some(p=>p.id===x.projId)),all=rp.sel===null;return `${head('Planilha de gastos',SP().proj&&SP().from==='proj'?'projview':'spend')}<main>
<div><label for="spper">Período</label><select id="spper">${[...PERS,['t','Total (todo o período)']].map(([k,l])=>`<option value="${k}"${rp.per===k?' selected':''}>${l}</option>`).join('')}</select></div>
${rp.per==='c'?`<div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label for="spfrom">De</label><input id="spfrom" type="date" value="${esc(rp.from)}"></div><div style="flex:1"><label for="spto">Até</label><input id="spto" type="date" value="${esc(rp.to)}"></div></div>`:''}
<div><b>Projetos incluídos</b><p class="muted" style="margin:2px 0 8px">Marque mais de um para juntar tudo no mesmo relatório.</p><div class="row"><button class="chip" data-sppick="all" aria-pressed="${all}">Todos</button>${P.map(p=>`<button class="chip" data-sppick="${p.id}" aria-pressed="${!all&&rp.sel.includes(String(p.id))}">${esc(p.name)}</button>`).join('')}${hasLoose?`<button class="chip" data-sppick="none" aria-pressed="${!all&&rp.sel.includes('none')}">Avulso (sem projeto)</button>`:''}</div></div>
<div><label for="spgrp">Agrupar por</label><select id="spgrp">${[['month','Mês'],['proj','Projeto'],['cat','Tipo de gasto'],['none','Não agrupar']].map(([k,l])=>`<option value="${k}"${rp.grp===k?' selected':''}>${l}</option>`).join('')}</select></div>
<div id="spout" aria-live="polite" style="display:flex;flex-direction:column;gap:14px">${spOut()}</div>
<button class="btn" data-act="sppdf">Baixar PDF</button>
<button class="btn ghost" data-act="spcsv">Baixar planilha (CSV)</button>
<p id="spdl" class="muted" role="status" style="margin:0"></p></main>`},
legal:()=>`${head('Termos e políticas','home')}<main>
<p class="muted" style="margin:0">Leia como o app funciona, como tratamos seus dados e as regras de pagamento e convivência.</p>
${LDOCS.map(k=>`<button class="pick" data-doc="${k}"><b>${esc(LEGAL[k].t)}</b></button>`).join('')}
<button class="btn ghost" data-go="privacy">Privacidade e dados (meu consentimento)</button></main>`,

${fld('emwhere','Onde você está? (rua, rodovia e km, ponto de referência)','type="text" autocomplete="off" value="'+esc(e.where)+'"')}
${fld('emregion','Cidade ou região mais próxima','type="text" autocomplete="address-level2" value="'+esc(e.region)+'"')}

<div><label class="chk" style="align-items:flex-start"><input type="checkbox" id="emcons" ${e.ok?'checked':''} aria-describedby="e-emcons"> <span>Estou ciente de que meu nome, meu WhatsApp e, se eu compartilhar, minha localização serão vistos pelos profissionais agora e de que a taxa fica pendente. Também quero ver profissionais próximos que autorizaram aparecer em emergências. Li a ${dlk('payments','política de pagamentos e reembolso')}.</span></label><div class="err" id="e-emcons"></div></div>
<button class="btn sos" data-act="emsend">Pedir ajuda agora</button>`}</main>`},

<div class="card"><h2>Pedido enviado</h2><p style="margin:8px 0 0">${esc(q.desc).replace(/\n/g,'<br>')}</p><p class="muted" style="margin:8px 0 0">Os profissionais já podem ver seu contato. Mantenha o WhatsApp por perto e, se estiver em perigo, ligue agora:</p>${emNums()}</div>

<div class="card"><b>Taxa pendente</b><p class="muted" style="margin:6px 0 0">Pague quando estiver em segurança, em Meus pedidos, ou no próximo uso do app.</p></div>
<button class="btn" data-go="mine">Ver meus pedidos</button><button class="btn ghost" data-go="home">Voltar ao início</button></main>`},
cplans:()=>{const r=plRec(),me=S.user.email,P=projs(),g=(r.cp||{}).geral,gOn=cpGeralOn(r),gu=gOn?cpUsed('geral'):0,sm=S.cpsim||{n:4,e:5},m=Math.max(1,Math.min(200,Math.round(+sm.n)||1)),e=Math.max(1,Math.min(50,Math.round(+sm.e)||1)),F=FEE/100,pc=k=>k<=1?F:Math.min(F*k,CPL.proj.price/100+Math.max(0,k-CPL.proj.quota)*F),full=Math.floor(m/e),rest=m%e,av=m*F,pj=full*pc(e)+(rest?pc(rest):0),gm=CPL.month.price/100+Math.max(0,m-CPL.month.quota)*F,best=Math.min(av,pj,gm),opts=[['Só avulso (todo pedido paga a taxa)',av],['Plano de projeto por etapas',pj],['Plano de contratante geral (mensal)',gm]];

<div class="stack">${CRED.map((c,i)=>{const t=c.pay+c.bonus;return`<button class="pick plan" data-act="crbuy" data-sid="${i}"><b>Pague ${brl2(c.pay/100)}</b><span class="pr">${brl2(t/100)} em crédito${c.bonus?' (bônus de '+brl2(c.bonus/100)+')':''}</span><span>${(t/FEE).toFixed(1).replace('.',',')} taxas · ${brl2(c.pay/(t/FEE)/100)} por pedido</span></button>`}).join('')}</div>

</main>`},

function pdfWriter(){

    hr(){need(16);y-=6;cur().push('0.5 w '+M+' '+y.toFixed(1)+' m '+(W-M)+' '+y.toFixed(1)+' l S');y-=8},
    para(s,z=9,max=100){let l='';for(const w of lat(s).split(' ')){if((l+' '+w).trim().length>max){api.line([[l,M]],z,false,3);l=w}else l=(l+' '+w).trim()}if(l)api.line([[l,M]],z,false,3)},
    build(){

      objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      const kids=[];
      pages.forEach((ops,i)=>{const c=5+i*2,p=6+i*2,body=ops.join('\n');
        objs[c]='<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream';
        objs[p]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+c+' 0 R >>';

      return Uint8Array.from(out,c=>c.charCodeAt(0));
    }
  };
  return api;
}

async function pickVideo(f){
  const R=S.rec;if(!f)return;R.err='';
  if(!/^video\//.test(f.type)){R.err='Escolha um arquivo de vídeo.';return recRender()}
  if(f.size>MAXV){R.err='Vídeo muito grande ('+(f.size/1048576).toFixed(1)+' MB). O limite é 20 MB: grave até 30 segundos ou use uma qualidade menor.';return recRender()}

  spSaveAll('ms_expenses',[...jget('ms_expenses'),{id:Date.now(),email:S.user.email,projId:f.proj,reqId:f.req,desc:f.desc.trim(),cat:f.cat,amount:v,date:f.date,at:new Date().toISOString()}]);
  SP().proj=f.proj||0;SP().f=newSpF();go(SP().proj?'projview':'spend');
}

const LEGAL={"terms": {"t": "Termos de Uso", "md": "Ao criar uma conta ou usar o {APP}, você concorda com estes Termos. Se não concordar, não use o app.\n\n**1. Quem somos.** O {APP} é operado por [RAZÃO SOCIAL], CNPJ [CNPJ], com sede em [ENDEREÇO], suporte em [E-MAIL DE SUPORTE].\n\n**2. O que o app faz.** O app aproxima pessoas que querem um serviço (contratantes) de profissionais que oferecem serviços (prestadores). Somos uma plataforma de intermediação e divulgação: **não executamos os serviços, não somos empregadores dos prestadores e não somos parte do contrato de serviço** entre contratante e prestador, salvo quando a lei disser o contrário.\n\n**3. Cadastro e conta.**\n\n- Você deve ter 18 anos ou mais e capacidade civil para contratar.\n- As informações do cadastro devem ser verdadeiras e atualizadas.\n- Uma mesma conta (mesmo e-mail) pode ter vários perfis: contratante, prestador, contratante empresa e prestador empresa.\n- A senha é pessoal. Avise-nos se suspeitar de uso indevido da sua conta.\n\n**4. Como funciona para o contratante.**\n\n- Você descreve o serviço, escolhe a urgência e a região e pode anexar um link de vídeo.\n- A análise de descrição, materiais e valores feita por inteligência artificial é **apenas uma estimativa de referência**; não é orçamento nem promessa de preço.\n- A pesquisa de preços de materiais mostra estimativas por tipo de loja e não consulta preços ao vivo; confirme o preço e o frete na loja.\n- Para publicar o pedido, você paga a taxa descrita na Política de Pagamentos. Depois do pagamento, seu nome e telefone ficam visíveis aos prestadores, como descrito na Política de Privacidade. Antes do pagamento, os prestadores só podem marcar que querem negociar: não enviam mensagem nem proposta, e a negociação só começa depois que você pagar a taxa. Em pedido de emergência, o contato fica visível desde o envio e a taxa fica pendente, como descrito na Política de Pagamentos.\n- Você vê apenas os seus próprios pedidos.\n\n**5. Como funciona para o prestador.**\n\n- Você é profissional autônomo ou empresa independente: define seus preços, prazos, horários e a forma de executar o serviço, e pode recusar pedidos.\n- Você é o único responsável pela qualidade, segurança e legalidade do serviço, pela habilitação e registros exigidos para a sua atividade, pelos materiais e pelos seus tributos e obrigações.\n- Enquanto o contratante não pagar a taxa, você só pode marcar \"Quero negociar\": não é possível enviar texto, valor ou contato antes disso. Depois do pagamento, você pode conversar e enviar sua proposta.\n- A sugestão de preço por inteligência artificial é só uma ajuda; o valor da proposta é decisão sua.\n- O demonstrativo de ganhos do app é informativo, feito com os dados que você registra. **Não é contracheque, holerite, nota fiscal ou comprovante oficial de renda.**\n- Nenhuma regra do app cria vínculo de emprego, sociedade, representação ou exclusividade entre você e a plataforma.\n\n**6. Contrato de serviço.** O contrato de execução do serviço é feito diretamente entre contratante e prestador. Combinem por escrito o escopo, o preço, o prazo, os materiais e a garantia. Cada um responde pelo que combinou e pelo que fizer.\n\n**7. Empresas e equipes.** Uma empresa pode usar o app como contratante ou como prestador. Quem cria o perfil empresa declara que tem poderes para isso e informa razão social e CNPJ verdadeiros. O prestador pessoa física informa se atua como MEI, autônomo ou particular, e responde pelas obrigações dessa forma de atuação. Os registros de funcionários, gastos, receitas, equipes por obra e relatórios são **controles internos** feitos com o que você digita: não substituem folha de pagamento, holerite, escrituração contábil nem consultoria. A empresa é a responsável por ter o direito de registrar dados de seus funcionários e deve registrar só o necessário. As estimativas de equipe, máquinas e materiais são referências e não garantem prazo nem custo. Tickets e cupons ganhos pela empresa podem ser repassados a funcionários cadastrados: o repasse é um controle interno, e a empresa responde por observar as regras trabalhistas e tributárias aplicáveis a brindes dados a empregados.\n\n**8. Impostos, comprovantes e guias.** O app ajuda a organizar informações, mas **não é contador nem a Receita Federal**. O comprovante de rendimentos só é gerado depois que as duas partes autorizarem, é um documento de apoio e **não** é documento oficial. A guia do INSS para autônomos é uma ajuda de preenchimento: confira valores, competência e vencimento no Meu INSS e no site do órgão, e pague pelos canais oficiais. O app não paga guias nem envia declarações em seu nome. Procure um contador para decidir o que declarar e pagar.\n\n**9. O que você não pode fazer.**\n\n- Usar o app para fins ilícitos, fraude, golpe, discriminação ou assédio.\n- Criar contas falsas ou usar dados de terceiros sem autorização.\n- Publicar pedidos ou vídeos que mostrem pessoas sem autorização, documentos, placas de veículos ou conteúdo ilegal.\n- Copiar dados do app de forma automatizada, tentar acessar áreas restritas ou burlar a liberação de contato e o pagamento da taxa.\n- Usar os dados de contato recebidos para outra finalidade que não seja tratar o serviço pedido, inclusive propaganda não solicitada.\n\n**10. Conteúdo que você publica.** Você continua dono dos seus textos, vídeos e fotos. Ao publicá-los, você nos autoriza, de forma gratuita e não exclusiva, a hospedar, exibir e divulgar esse conteúdo dentro do app para o funcionamento da plataforma, pelo tempo em que ele estiver publicado. Você declara que tem o direito de usar esse conteúdo e as autorizações de quem aparece nele. Veja as Regras da comunidade.\n\n**11. Responsabilidade.**\n\n- Não garantimos que você receberá propostas, pedidos ou um resultado específico.\n- Não respondemos pelos serviços executados, por danos causados entre contratante e prestador ou por informações falsas fornecidas pelos usuários, exceto quando a lei atribuir essa responsabilidade à plataforma, inclusive nas relações de consumo.\n- Nada nestes Termos limita direitos que a lei não permite limitar, como os do Código de Defesa do Consumidor.\n- O app pode ficar indisponível por manutenção ou por falhas fora do nosso controle; trabalhamos para reduzir esses casos.\n\n**12. Suspensão e encerramento.** Você pode encerrar sua conta quando quiser, em Privacidade e dados. Podemos suspender ou encerrar contas que violem estes Termos ou a lei, explicando o motivo sempre que possível e permitindo que você se manifeste.\n\n**13. Mudanças.** Podemos atualizar estes Termos. Avisaremos pelo app ou por e-mail com antecedência razoável quando a mudança for relevante e pediremos novo aceite. Se você não concordar, poderá encerrar a conta.\n\n**14. Lei e foro.** Estes Termos seguem a lei brasileira. Fica eleito o foro de [FORO], ressalvado o direito do consumidor de ajuizar ação no foro do seu domicílio.\n\n**15. Contato.** Dúvidas, reclamações e pedidos: [E-MAIL DE SUPORTE]."}, "privacy": {"t": "Política de Privacidade", "md": "Esta Política explica quais dados pessoais o {APP} trata, para quê, com quem compartilha e quais são os seus direitos, conforme a Lei Geral de Proteção de Dados (Lei 13.709/2018, a LGPD).\n\n**1. Quem decide sobre os seus dados (controlador).** [RAZÃO SOCIAL], CNPJ [CNPJ], [ENDEREÇO]. Canal do encarregado de dados: [E-MAIL DO ENCARREGADO].\n\n**2. Dados que tratamos, para quê e com qual base legal.**\n\n| Dado | Para quê | Base legal |\n| --- | --- | --- |\n| Nome, e-mail, telefone, senha (guardada de forma protegida) | Criar e proteger a conta, entrar no app, atender você | Execução de contrato |\n| Categoria e cidade de atuação (prestador) | Mostrar pedidos adequados | Execução de contrato |\n| Descrição do serviço, bairro ou cidade, urgência, link de vídeo (contratante) | Publicar o pedido e receber propostas | Execução de contrato |\n| Nome e telefone do contratante | Liberar o contato aos prestadores depois do pagamento da taxa ou, em pedido de emergência, antes dele | Execução de contrato e aviso claro no pagamento |\n| Nome, categoria, cidade e WhatsApp do prestador, e localização aproximada (só se ele autorizar) | Mostrar a pessoas em emergência próximas, só quando uma emergência for detectada e a pessoa aceitar as condições | Consentimento (pode ser retirado a qualquer momento) |\n| Localização do aparelho (só se você tocar em Usar minha localização) | Perceber se é emergência e mostrar o local aos prestadores no pedido de emergência | Consentimento (pode ser retirado) |\n| Propostas, valores, prazos e serviços concluídos | Negociação e demonstrativo de ganhos do prestador | Execução de contrato |\n| Perfil de empresa: razão social e CNPJ; forma de atuação do prestador (MEI, autônomo ou particular) | Mostrar nos pedidos e propostas e preparar comprovantes e guias | Execução de contrato |\n| CPF e, quando for o caso, CNPJ (informados só quando você gera guia do INSS ou comprovante de rendimentos) | Preencher a guia e o comprovante. O CPF do seu cadastro fica só no aparelho; no comprovante, o CPF ou CNPJ de cada parte vai para a nuvem do app para que a outra parte possa autorizar e gerar o documento | Execução de contrato e consentimento |\n| Comprovante de rendimentos: nome, CPF ou CNPJ e valores dos serviços entre as duas partes | Gerar o comprovante, **somente depois que as duas partes autorizarem**; cada uma pode ver o que a outra autorizou | Consentimento de cada parte |\n| Funcionários da empresa (nome, função, custo mensal), gastos da equipe, receitas lançadas por fora e equipe por obra | Controle interno e relatórios da empresa, visíveis só para você. Ficam no seu aparelho; o repasse de brindes guarda na nuvem só um número de referência, sem o nome | Execução de contrato (a empresa é responsável por ter o direito de registrar dados de seus funcionários) |\n| Planos assinados e histórico de taxas, assinaturas e reembolsos | Cobrar, mostrar o que está incluso e gerar o relatório de gastos com a plataforma | Execução de contrato e obrigação legal |\n| Projetos e gastos lançados pelo contratante ou registrados automaticamente pelo app (taxa de cada pedido) | Planilhas e relatórios de gastos, visíveis só para você | Execução de contrato |\n| Mensagens do chat, avisos de mensagem e autorização de ligações | Conversar sobre o serviço, combinar horário e liberar ligações entre as duas partes, inclusive mantendo a conversa igual nos seus aparelhos (guardada na nuvem do app) | Execução de contrato e consentimento (a autorização de ligações pode ser retirada) |\n| Vídeos, imagem e voz que você publica | Divulgar o seu trabalho na vitrine do app | Consentimento (pode ser retirado) |\n| Dados de pagamento | Cobrar a taxa; cartão e Pix são tratados pelo [PROVEDOR DE PAGAMENTO] e o app não guarda número de cartão | Execução de contrato e obrigação legal |\n| Registros de acesso (IP, data e hora, aparelho) | Segurança, prevenção a fraudes e guarda exigida em lei | Obrigação legal e legítimo interesse |\n| Documento e foto para verificação de identidade do prestador (quando ativada) | Evitar fraudes e dar segurança aos usuários | Prevenção à fraude e segurança do titular; a foto do rosto é dado biométrico (sensível) |\n| E-mail e telefone para novidades e ofertas | Comunicações de marketing | Consentimento (separado e opcional) |\n\nNão pedimos dados sensíveis além dos citados e não vendemos seus dados pessoais.\n\n**3. Inteligência artificial.** Para analisar a descrição do serviço, estimar materiais e sugerir preços, o texto que você escreve (sem nome e telefone) é enviado a um serviço de IA. Não inclua dados pessoais nem sensíveis nas descrições. As estimativas não são decisões sobre você; você pode ignorá-las e, se houver decisão automatizada que afete seus interesses, pode pedir revisão (LGPD, art. 20).\n\n**4. Com quem compartilhamos.**\n\n- **Prestadores:** veem o pedido publicado (sem a sua estimativa de valor) e, depois do pagamento da taxa (ou, em pedido de emergência, desde o envio), o nome e o telefone do contratante.\n- **Contratantes:** veem o nome, o valor e a mensagem das propostas recebidas e os vídeos publicados pelo prestador.\n- **A outra parte do serviço:** no comprovante de rendimentos, cada parte só vê os dados da outra depois que as duas autorizarem. Funcionários, gastos e relatórios da empresa **não** são compartilhados com ninguém.\n- **Fornecedores que nos ajudam a operar:** processamento de pagamentos, hospedagem e armazenamento em nuvem, inteligência artificial, envio de mensagens e verificação de identidade. Só podem usar os dados para nos prestar o serviço.\n- **Autoridades:** quando a lei ou uma ordem judicial exigir.\n\n**5. Transferência para fora do Brasil.** Alguns fornecedores (nuvem, IA, mensagens) podem tratar dados em outros países. Quando isso acontecer, usaremos as garantias previstas na LGPD (art. 33), como cláusulas contratuais adequadas. [CONFIRMAR OS PAÍSES E FORNECEDORES FINAIS]\n\n**6. Por quanto tempo guardamos.**\n\n| Dado | Prazo |\n| --- | --- |\n| Dados da conta | Enquanto a conta existir; excluídos ou anonimizados depois, salvo o que a lei obrigar a guardar |\n| Registros de acesso ao app | 6 meses, no mínimo (Marco Civil da Internet, art. 15) |\n| Dados fiscais e de pagamento da taxa | Pelo prazo legal fiscal e contábil [CONFIRMAR COM O CONTADOR] |\n| Pedidos, propostas e mensagens | Pelo tempo necessário para atender reclamações e defender direitos [DEFINIR PRAZO] |\n| Vídeos publicados | Até você excluí-los ou encerrar a conta |\n| Funcionários, gastos da equipe, receitas por fora e relatórios da empresa | Ficam no seu aparelho até você apagar ou excluir a conta |\n| Chat e avisos sincronizados | Enquanto a conta existir; apagados com a conta |\n\n**7. Segurança.** Usamos senhas protegidas, conexão criptografada, controle de acesso e cópias de segurança. Nenhum sistema é 100% seguro; se houver um incidente que possa causar risco ou dano relevante, avisaremos você e a Autoridade Nacional de Proteção de Dados (ANPD) nos termos da lei.\n\n**8. Armazenamento no aparelho e permissões.**\n\n- O app guarda dados no seu aparelho ou navegador para manter você conectado, lembrar preferências e guardar gastos, funcionários e relatórios. Se o aparelho ficar sem espaço, o app avisa; baixe uma cópia em Privacidade e dados antes de apagar algo. Pedidos, propostas, planos e conversas também são sincronizados na nuvem do app para funcionar em mais de um aparelho. Esta versão não usa cookies de análise ou publicidade; se passarmos a usar, pediremos o seu consentimento antes.\n- O app só pede acesso à câmera e ao microfone quando você escolhe gravar um vídeo, e à localização apenas se você ativar um recurso que precise dela.\n\n**9. Seus direitos (LGPD, art. 18).** Você pode pedir, sem custo: confirmação de que tratamos seus dados e acesso a eles; correção; anonimização, bloqueio ou eliminação de dados desnecessários; portabilidade; eliminação dos dados tratados com consentimento; informação sobre com quem compartilhamos; revogação do consentimento; oposição a tratamento irregular; revisão de decisões automatizadas. Em Privacidade e dados você pode corrigir seus dados, baixar uma cópia, retirar o consentimento de marketing e excluir a conta. Para outros pedidos, escreva para [E-MAIL DO ENCARREGADO]. A resposta simplificada deve ser imediata e a completa em até 15 dias. Alguns dados precisam ser mantidos por obrigação legal, e explicaremos quando isso acontecer.\n\n**10. Menores de idade.** O app é destinado a maiores de 18 anos. Se descobrirmos que uma conta é de menor, ela será encerrada e os dados eliminados, salvo o que a lei obrigar a guardar.\n\n**11. Mudanças e reclamações.** Quando mudarmos esta Política de forma relevante, avisaremos pelo app e, se for preciso, pediremos novo consentimento. Se não ficar satisfeito, você pode reclamar à ANPD (gov.br/anpd)."}, "community": {"t": "Regras da comunidade", "md": "**1. Conduta.** Trate todos com respeito. Não são permitidos assédio, ofensas, discriminação, ameaças, golpes, propostas falsas, pedido de pagamento fora do app para fugir das regras e qualquer atividade ilegal.\n\n**2. Vídeos e fotos.**\n\n- Mostre o serviço e o resultado. Evite rostos de outras pessoas, crianças, documentos, placas de veículos, números de casas e telas com dados pessoais.\n- Você só pode publicar o que você mesmo gravou ou o que tem autorização para usar, incluindo música e imagens de terceiros (direitos autorais).\n- Limites atuais: 2 minutos e 20 MB por vídeo.\n- Não são permitidos nudez, violência, conteúdo enganoso, propaganda de outros serviços ou produtos que não sejam o seu trabalho e conteúdo que prejudique crianças e adolescentes.\n\n**3. Avaliações (quando existirem).** Devem ser feitas apenas por quem realmente contratou ou prestou o serviço, descrever a experiência real e não ser compradas, trocadas por vantagem ou escritas em nome de terceiros. Avaliações falsas podem ser removidas e a conta suspensa.\n\n**4. Denúncias e remoção.**\n\n- Em cada vídeo e em cada pedido há um botão Denunciar, e também o canal [E-MAIL DE SUPORTE].\n- Analisamos as denúncias e podemos retirar o conteúdo que viole estes Termos ou a lei.\n- Conteúdo que viole direitos de crianças e adolescentes será retirado ao ser notificado, sem precisar de ordem judicial. Nos demais casos seguimos o Marco Civil da Internet (art. 19), sem prejudicar nossas regras internas de moderação.\n\n**5. Consequências.** Dependendo da gravidade: aviso, remoção do conteúdo, suspensão temporária ou encerramento da conta. Sempre que possível, avisamos o motivo e oferecemos a chance de contestar pelo [E-MAIL DE SUPORTE].\n\n**6. Segurança pessoal.** Combine o serviço com cuidado: confirme os dados do pedido, evite pagamentos adiantados altos e, se sentir risco, não realize o serviço e avise o suporte. Em emergência, ligue 190 (polícia) ou 192 (SAMU)."}, "payments": {"t": "Pagamentos e reembolso", "md": "**1. Taxa de publicação (contratante).** Para publicar um pedido com o contato liberado, o contratante paga a taxa de {FEE}, em reais, com todos os tributos inclusos. O valor é mostrado antes da confirmação, junto com o que a taxa inclui: publicar o pedido e liberar o seu contato aos prestadores. A taxa **não** inclui o preço do serviço, que é combinado diretamente com o prestador. **Todo pedido paga a taxa**, seja avulso ou parte de um projeto com várias etapas. Os planos opcionais (item 7) podem cobrir essas taxas, e o app mostra isso na tela de pagamento antes de você confirmar.\n\n**2. Como pagar.** Pix ou cartão, por meio do [PROVEDOR DE PAGAMENTO]. O app não recebe nem guarda o número do seu cartão. O pedido pode ser publicado antes do pagamento, mas o seu contato fica bloqueado e os prestadores só podem marcar que querem negociar, sem enviar mensagem nem proposta, até a taxa ser paga. Nesta versão de demonstração o pagamento é simulado e nenhum valor é cobrado.\n\n**3. Direito de arrependimento e reembolso.** [SUGESTÃO, A VALIDAR COM O ADVOGADO] O Código de Defesa do Consumidor (art. 49) dá 7 dias para desistir de contratações feitas fora do estabelecimento, como na internet. Política adotada:\n\n- Se nenhum prestador entrar em contato por esse pedido em 7 dias depois do pagamento, você pode pedir o reembolso integral da taxa. A opção aparece em Meus pedidos depois desses 7 dias.\n- Se algum prestador entrar em contato (marcar que quer negociar, enviar proposta ou mensagem), a opção de reembolso deixa de existir. Nesse caso a taxa é devolvida apenas nos casos previstos em lei, em cobrança duplicada, erro do app ou pedido recusado por não cumprir as regras.\n- O reembolso é feito pelo mesmo meio de pagamento, em até [PRAZO] dias úteis depois da aprovação.\n- O pedido de reembolso pode ser feito em Meus pedidos ou por [E-MAIL DE SUPORTE].\n\n**4. Cobrança indevida ou duplicada.** Fale com o suporte. Vamos apurar e devolver o valor cobrado a mais, quando for o caso, nos termos da lei.\n\n**5. Nota fiscal e comprovante.** O comprovante e, quando exigida, a nota fiscal da taxa serão enviados por e-mail. [CONFIRMAR OBRIGAÇÕES FISCAIS COM O CONTADOR]\n\n**6. Pagamento do serviço ao prestador.** Hoje o pagamento do serviço é feito diretamente entre as partes, **fora** do app, e não respondemos por ele. [MÓDULO FUTURO] Se o app passar a receber esse pagamento, o valor ficará retido em conta de custódia do [PROVEDOR DE PAGAMENTO] até o contratante confirmar a conclusão ou até [N] dias sem contestação, e depois será repassado ao prestador já descontada a comissão.\n\n**7. Planos opcionais.** [VALORES A DEFINIR] Os planos são opcionais, o valor aparece antes da confirmação, a renovação e o cancelamento são explicados na tela e o cancelamento pode ser feito a qualquer momento, no próprio app, sem multa. Os planos não escondem propostas de outros prestadores. Pontos e prêmios não têm valor em dinheiro e não podem ser vendidos ou transferidos.\n\n- **Prestador (mensal ou anual):** vantagens de conveniência e visibilidade, como alertas prioritários, destaque, relatórios e pontos.\n- **Contratante, plano de projeto em etapas:** um valor único por projeto cobre a taxa de um número limitado de pedidos (etapas) desse projeto, dentro de um prazo. O que passar do limite ou do prazo paga a taxa normal.\n- **Contratante, crédito pré-pago:** o contratante compra crédito em reais, às vezes com bônus, e usa o saldo para pagar as taxas dos pedidos. O saldo é sempre mostrado em reais. O bônus é uma vantagem, não tem valor em dinheiro e não é devolvido. O valor pago e não usado pode ser devolvido, na forma da lei. [CONFIRMAR COM O ADVOGADO: validade do saldo, devolução do valor não usado, tratamento fiscal e se o crédito pode ser tratado como moeda eletrônica]\n- **Contratante, plano geral (mensal ou anual):** cobre a taxa de um número limitado de pedidos por mês, em projetos ou avulsos. O que passar do limite no mês paga a taxa normal. A cota não usada no mês não acumula.\n- Pedidos cobertos por plano aparecem como \"taxa coberta pelo plano\". Se o pedido for reembolsado ou o plano cancelado, os pedidos já feitos continuam valendo e não há devolução da parte da cota não usada, salvo o que a lei garantir. [CONFIRMAR COM O ADVOGADO: regras de renovação automática, reembolso proporcional e nota fiscal]\n\n**8. Campanhas e brindes.** Podemos criar campanhas por período, com brindes e vantagens, mostradas antes de começar, com as regras claras. Sorteios e outras modalidades de promoção com distribuição de prêmios dependem de autorização na forma da lei e só serão feitos depois de cumpridas essas exigências. Descontos na taxa de publicação, quando houver, são aplicados no pagamento seguinte, não são convertidos em dinheiro e não são devolvidos em caso de reembolso além do valor efetivamente pago. [CONFIRMAR COM O ADVOGADO]\n\n**9. Lojas parceiras e cupons.** Pontos podem ser trocados por cupons ou vales de lojas parceiras, nas condições mostradas antes da troca (valor, validade e loja). O cupom é de responsabilidade da loja que o emite e não é convertido em dinheiro. Os tickets de experiências (restaurantes, brinquedotecas, passeios e similares) seguem a mesma regra: dependem de contrato com cada parceiro, têm validade e código de uso único e não valem em dinheiro. [CONFIRMAR COM O ADVOGADO: contratos com lojas e regras de validade]\n\n**10. Pedido de emergência.** [A VALIDAR COM O ADVOGADO] Em situações de urgência real, como veículo sem condições de seguir em rodovia fora da cidade ou de madrugada, o contratante pode pedir ajuda sem pagar a taxa na hora: o nome e o telefone ficam visíveis aos prestadores desde o envio e a taxa fica pendente para ser paga assim que a pessoa estiver em segurança ou no próximo uso do app, antes de novos pedidos. Só pode haver um pedido de emergência com taxa pendente por vez. Depois de confirmar o pedido, mostramos ao contratante os prestadores próximos que autorizaram, de forma opcional e revogável, aparecer em emergências, e nada garante que algum deles esteja disponível. O app não é serviço de emergência, não garante a chegada de ajuda nem o tempo de resposta; em risco à vida, ligue 190, 192 ou 193. Se a taxa não for paga, podemos limitar novos pedidos até a regularização.\n\n**11. Mudança de valores.** Vamos avisar antes de alterar a taxa. A mudança não vale para pedidos já pagos.\n\n**12. Seus relatórios de gastos.** Em Relatórios, cada perfil pode ver e baixar, em PDF ou planilha, os valores pagos ao {APP}: taxas de pedidos, assinaturas e reembolsos. Os arquivos são informativos e **não** substituem nota fiscal nem recibo. Na versão de demonstração os valores são simulados.\n\n**13. Destaque de vídeos (prestador).** O prestador pode pagar para que um vídeo seu apareça primeiro quando alguém vê todos os vídeos, sem buscar um trabalhador específico. O vídeo aparece com a etiqueta \"Destaque\". No máximo 3 vídeos em destaque aparecem no topo por vez e eles se revezam. Há um número limitado de vagas por categoria e cidade, e o preço pode subir quando a procura for grande. Só vídeos que seguem as Regras da comunidade podem ser destacados, e o destaque pode ser retirado se o vídeo for denunciado e removido. Planos Mensal e Anual incluem dias de destaque por mês, que não acumulam nem viram dinheiro. Na versão de demonstração os valores são simulados."}};

const mdInline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function mdHtml(md){
  return md.split(/\n\n+/).map(b=>{
    const R=b.split('\n');
    if(R.every(l=>l[0]==='|')){const T=R.filter(l=>!/^\|\s*-/.test(l)).map(l=>l.split('|').slice(1,-1).map(c=>c.trim()));
      return `<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%">${T.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'} style="border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top">${mdInline(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>`}
    if(R.every(l=>l.startsWith('- ')))return `<ul style="margin:0;padding-left:20px">${R.map(l=>`<li>${mdInline(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p style="margin:0">${R.map(mdInline).join('<br>')}</p>`}).join('');
}

  if(D.act==='admsusp'){if(!conf('s'+D.em))return;const l=users(),u=l.find(x=>x.email===D.em);if(u&&!ADMINS.includes(D.em)){u.susp=!u.susp;saveUsers(l)}return render()}
  if(D.act==='admdel'){if(!conf('d'+D.em))return;if(!ADMINS.includes(D.em))admDelUser(D.em);return render()}
  if(D.act==='admdelreq'){if(!conf('r'+D.rid))return;admDelReq(+D.rid);return render()}
  if(D.act==='admrepok'){const l=jget('ms_reports'),x=l.find(y=>y&&String(y.id)===D.id);if(x){x.done=new Date().toISOString();spSaveAll('ms_reports',l)}return render()}
  if(D.act==='admrepdel'){if(!conf('x'+D.id))return;const l=jget('ms_reports'),x=l.find(y=>y&&String(y.id)===D.id);if(x){if(x.kind==='request')admDelReq(+x.target);x.done=new Date().toISOString();spSaveAll('ms_reports',l)}return render()}
  if(D.act==='admratedel'){if(!conf('t'+D.id))return;spSaveAll('ms_rates',jget('ms_rates').filter(x=>x&&String(x.id)!==D.id));return render()}
  if(D.act==='admcfgsave'){const m=$('#admcfgmsg'),v=Math.round(Number(String($('#admfee').value).replace(',','.'))*100);if(!(v>=0&&v<=100000)){m.textContent='Informe um valor entre R$ 0,00 e R$ 1.000,00.';return}
    const te=String($('#admtest').value).split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>EMAIL.test(x)).slice(0,20);
    const pf=String($('#admptsfrom').value||'');if(pf&&!/^\d{4}-\d{2}-\d{2}$/.test(pf)){m.textContent='Escolha uma data válida para o programa de pontos.';return}
    spSaveAll('ms_cfg',[{id:'cfg',fee:v,testers:te,ptsFrom:pf,at:new Date().toISOString()}]);cfgApply();m.textContent='Ajustes salvos.';return}
}

(function init(){
  syInit();
const em=store.getItem('ms_session'),u=em&&users().find(x=>x.email===em);
  if(u&&!u.susp){S.user=view(u,pickRole(u));S.v=needsC(u)?'accept':'home'}
  cfgApply();render();
})();
</script>
