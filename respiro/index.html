/* ---------- comunidade e avaliações (banco compartilhado, só funciona aberto pelo Claude com login) ---------- */
let DB=null,UID=null,ADM=false,comOn=true,cobOn=false,comAll=[],revAll=[],comX={},comR={},comL={},comLoaded=false,comFail=false,dirty=false,grpAll=[],gmAll=[],gmsgAll=[],orrAll=[];

const dv=(k,d)=>k in S.dr?S.dr[k]:d;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'agora';if(m<60)return m+' min';const h=Math.round(m/60);if(h<24)return h+' h';const d=Math.round(h/24);return d<30?d+' d':new Date(t).toLocaleDateString('pt-BR')};

 return{n,avg:n?fmt1(avg):'',duT:dd.length,duY:dd.filter(r=>r.du==='sim').length,pgn:pg.length,pm:pg.length?pg[Math.floor(pg.length/2)]:0}}

${nickField()}
<label class="row" style="gap:10px;font-weight:500;align-items:flex-start"><input type="checkbox" data-dr="v_sh" ${dv('v_sh',true)?'checked':''} style="width:22px;height:22px;flex:none"><span>Enviar esta avaliação também ao próprio lugar, para ele ver e melhorar</span></label>
<div class="err" id="ve" role="alert"></div><button class="btn sun" type="submit">${mine?'Atualizar minha avaliação':'Publicar avaliação'}</button>${mine?'<p class="m">Você já avaliou este lugar. Enviar de novo substitui a anterior.</p>':''}</form>`:needLogin;
 return `<div class="card"><details data-k="rv" ${op('rv',true)}><summary><span>Avaliações dos visitantes ${st.n?`<span class="m">· ★ ${st.avg} (${st.n})</span>`:''}</span></summary><div class="dbody">

${st.n?`${p.du&&st.duT?`<div class="kv"><span>Day use funcionou como informado</span><span>${st.duY} de ${st.duT} visitantes</span></div>`:''}${st.pgn?`<div class="kv"><span>Visitantes relataram pagar cerca de</span><span>${brl(st.pm)} por pessoa (${st.pgn} relato${st.pgn>1?'s':''})</span></div>`:''}`:(DB&&comLoaded?'<p class="m">Ninguém avaliou este lugar ainda. Seja a primeira pessoa.</p>':'')}
${L.map(r=>`<div class="card" style="background:var(--bg)"><div class="row sp"><span><b aria-label="Nota ${r.s} de 5">${stars(r.s)}</b> <span class="m">${esc(r.nick)} · ${esc(r.mes||'')}</span></span><span class="m">${ago(r.at)}</span></div>${r.du==='sim'?'<span class="tag ok" style="justify-self:start">Day use funcionou</span>':r.du==='nao'?'<span class="tag warn" style="justify-self:start">Day use não funcionou como informado</span>':''}${r.pg?`<span class="m">Pagou ${brl(r.pg)} por pessoa</span>`:''}${r.txt?`<p>${esc(r.txt)}</p>`:''}${comX[r.id]?'<span class="tag warn" style="justify-self:start">Oculta pela moderação</span>':''}<div class="row"><button class="chip" data-act="like" data-id="${r.id}" aria-pressed="${!!(comL[r.id]&&comL[r.id].has(UID))}">Útil${comL[r.id]?' · '+comL[r.id].size:''}</button><button class="chip" data-act="rep" data-id="${r.id}">Denunciar</button>${r.uid===UID?`<button class="chip" data-act="delr" data-id="${r.id}">Apagar</button>`:''}${ADM?`<button class="chip" data-act="hide" data-id="${r.id}">${comX[r.id]?'Mostrar':'Ocultar'}</button>`:''}</div></div>`).join('')}
</div></details></div>
<div class="card"><details data-k="rvf" ${op('rvf',false)}><summary>Avaliar este lugar</summary><div class="dbody"><p class="m">Só avalie se você visitou. Seu relato ajuda os outros a saber se o day use e o preço estão certos.</p>${form}<button class="btn gh" type="button" data-act="siteg">Deixar também no site ou no Google do lugar</button><p class="m">No app de verdade, este botão leva ao canal de avaliação do próprio estabelecimento.</p></div></details></div>`}
function comPlace(p){const L=posts().filter(x=>x.pid===p.id&&!x.re).sort((a,b)=>b.at-a.at).slice(0,5);return `<div class="card"><details data-k="cp" ${op('cp',false)}><summary>Na comunidade sobre este lugar ${L.length?`<span class="m">· ${L.length}</span>`:''}</summary><div class="dbody">${groups().filter(g=>g.pid===p.id&&grpAtivo(g)).map(grpTile).join('')}${L.map(postCard).join('')||'<p class="m">Ninguém comentou este lugar ainda.</p>'}<button class="btn" data-act="postpl" data-id="${p.id}">Escrever sobre este lugar</button></div></details></div>`}
function ownRev(p){const L=revsOf(p.id).filter(r=>r.sh);return `<details data-k="own_${p.id}" ${op('own_'+p.id,false)}><summary>Avaliações enviadas a este lugar ${L.length?'· '+L.length:''}</summary><div class="dbody">${L.map(r=>`<div class="card"><b>${stars(r.s)}</b> <span class="m">${esc(r.nick)}</span>${r.txt?`<p>${esc(r.txt)}</p>`:''}</div>`).join('')||'<p class="m">Ainda não há avaliações enviadas a este lugar.</p>'}<p class="m">No app de verdade, só o dono conferido vê este painel e pode responder.</p></div></details>`}
function postCard(p){const rp=posts().filter(x=>x.re===p.id).sort((a,b)=>a.at-b.at),pl=p.pid?byId(p.pid):null;
 return `<div class="card pop"><div class="row sp"><span class="row" style="gap:6px"><b>${esc(p.nick)}</b><span class="tag">${KINDS[p.k]||'Publicação'}</span></span><span class="m">${ago(p.at)}</span></div>${pl?`<button class="chip" data-open="${pl.id}"><span class="dot" style="background:${col(pl.t)}"></span>${esc(pl.n.replace(' (exemplo)',''))}</button>`:''}<p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.txt)}</p>${p.g&&gById(p.g)?`<p class="m">Organizador: ${orgLine(p.uid)}</p><div class="row"><button class="btn gh" data-grp="${p.g}">Ver grupo e entrar</button><button class="chip" data-prf="${p.uid}">Ver histórico de ${esc(p.nick)}</button></div>`:''}${comX[p.id]?'<span class="tag warn" style="justify-self:start">Oculta pela moderação</span>':''}
<div class="row"><button class="chip" data-act="like" data-id="${p.id}" aria-pressed="${!!(comL[p.id]&&comL[p.id].has(UID))}">Curtir${comL[p.id]?' · '+comL[p.id].size:''}</button><button class="chip" data-act="rpto" data-id="${p.id}">Responder</button><button class="chip" data-act="rep" data-id="${p.id}">Denunciar</button>${p.uid===UID?`<button class="chip" data-act="delp" data-id="${p.id}">Apagar</button>`:''}${ADM?`<button class="chip" data-act="hide" data-id="${p.id}">${comX[p.id]?'Mostrar':'Ocultar'}</button>`:''}</div>

<p class="m">Não publique telefone, link nem dados de outras pessoas. Use o contato do lugar.</p><div class="err" id="xe" role="alert"></div><button class="btn sun" type="submit">Publicar</button></form>`:`<div class="dbody">${needLogin}</div>`}</details></div>
<div class="row">${[['tudo','Tudo'],...Object.entries(KINDS)].map(([v,l])=>`<button class="chip" data-ck="${v}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>

/* ---------- grupos de passeio e conversa ---------- */
function viewCom(){if(!DB||(!comOn&&!ADM))return viewComPub();return `<div class="row"><button class="chip" data-cs="pub" aria-pressed="${S.cs!=='grp'}">Publicações</button><button class="chip" data-cs="grp" aria-pressed="${S.cs==='grp'}">Grupos de passeio</button></div>`+(S.cs==='grp'?viewGrupos():viewComPub())}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
const groups=()=>flat(grpAll).filter(g=>ADM||!comX[g.id]);
const gById=id=>flat(grpAll).find(g=>g.id===id);
const grpOk=(g,u)=>!(g.rj||[]).includes(u)&&(g.uid===u||!g.apv||(g.ap||[]).includes(u));
const membersOf=id=>{const g=gById(id);return g?gmAll.filter(m=>m.ids.includes(id)&&grpOk(g,m.uid)):[]};
const pendOf=id=>{const g=gById(id);return g&&g.apv?gmAll.filter(m=>m.ids.includes(id)&&m.uid!==g.uid&&!(g.ap||[]).includes(m.uid)&&!(g.rj||[]).includes(m.uid)):[]};
const isPend=id=>!!UID&&pendOf(id).some(m=>m.uid===UID);
const isRej=id=>{const g=gById(id);return !!(UID&&g&&(g.rj||[]).includes(UID)&&gmAll.some(m=>m.uid===UID&&m.ids.includes(id)))};
const nickOf=u=>(gmAll.find(m=>m.uid===u)||{}).nick||(flat(grpAll).find(g=>g.uid===u)||{}).nick||'Pessoa';
const isMem=id=>!!UID&&membersOf(id).some(m=>m.uid===UID);
const msgsOf=id=>flat(gmsgAll).filter(m=>m.g===id&&(ADM||!comX[m.id])).sort((a,b)=>a.at-b.at);

<script>
/* ---- Problema ou sugestão ---- */
(function(){
const FBX={app:'Respiro',mail:'prumo91@yahoo.com',toast:t=>toast(t),after:()=>fbDraw(),tela:()=>S.v};
/* ---------- problema ou sugestão (comum aos apps) ---------- */
const FB_T=[['bug','🐞 Algo travou'],['ideia','💡 Sugestão de melhoria'],['novo','🛠️ Serviço ou produto novo'],['elogio','👏 Elogio']],FB_S={nova:'Nova',vista:'Vista',ok:'Resolvida'};
const FB_PH={bug:'Ex.: a tela travou quando toquei em Enviar',ideia:'Ex.: seria bom poder filtrar por cidade',novo:'Ex.: queria encontrar também serviço de jardinagem',elogio:'Ex.: achei muito fácil de usar'};
const FBU={t:'bug',img:'',resp:true,msg:'',ft:'',fs:'',mo:false};
const fbE=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fbTL=t=>(FB_T.find(x=>x[0]===t)||[0,'💬 Mensagem'])[1];
const fbProt=x=>String(x.id).slice(-6);
const fbDt=s=>{try{return new Date(s).toLocaleDateString('pt-BR')}catch(e){return ''}};
function fbShrink(file){return new Promise((ok,no)=>{if(!file||!/^image\//.test(file.type||''))return no();const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
function fbForm(){const mine=FBC.my.slice().sort((a,b)=>b.id-a.id);
  return `<div class="card fbcard" id="fbbox"><b>💬 Enviar problema ou sugestão</b><p class="muted" style="margin:6px 0 10px">Algo travou, ficou confuso ou você teve uma ideia? Conte aqui. A mensagem vai direto para a equipe do ${FBX.app}.</p>
<div class="fbchips" role="group" aria-label="Tipo da mensagem">${FB_T.map(([k,l])=>`<button type="button" class="fbchip" data-fbt="${k}" aria-pressed="${FBU.t===k}">${l}</button>`).join('')}</div>
<label for="fbtx" class="fblab">Conte com suas palavras</label><textarea id="fbtx" rows="3" maxlength="800" placeholder="${FB_PH[FBU.t]}"></textarea>
<div class="fbrow"><label class="fbbtn">📷 ${FBU.img?'Trocar o print':'Anexar print (opcional)'}<input type="file" accept="image/*" id="fbimg" class="fbsr" aria-label="Anexar print da tela"></label>${FBU.img?`<span class="fbprev"><img src="${FBU.img}" alt="Print anexado"><button type="button" data-fbx="rmimg" aria-label="Remover o print">✕</button></span>`:''}</div>
${FBC.uid?`<label class="fbchk"><input type="checkbox" id="fbresp" ${FBU.resp?'checked':''}> Quero receber resposta aqui no app</label>`:'<p class="fbsm" style="margin:8px 0 0">Como visitante, a mensagem sai pelo seu e-mail e a resposta chega nele. Entre para receber resposta aqui no app.</p>'}
<button type="button" class="fbsend" data-fbx="send">Enviar</button><div id="fbmsg" class="fbmsg" role="status" aria-live="polite">${FBU.msg}</div>
${mine.length?`<details class="fbmine" id="fbmine"${FBU.mo?' open':''}><summary>Minhas mensagens (${mine.length})</summary>${mine.slice(0,20).map(x=>`<div class="fbit"><div class="fbh"><span class="fbtag">${fbTL(x.tipo)}</span><span class="fbst fbst-${x.st||'nova'}">${FB_S[x.st||'nova']}</span></div><p>${fbE(String(x.text||x.tx||'').slice(0,300))}</p>${x.rep?`<p class="fbrep"><b>Resposta da equipe:</b> ${fbE(x.rep)}</p>`:''}<p class="fbsm">Protocolo ${fbProt(x)} · ${fbDt(x.at)}</p></div>`).join('')}</details>`:''}</div>`}
function fbLink(){return `<button type="button" class="fblink" data-fbx="open"><span class="fbi" aria-hidden="true">💬</span><span class="fbx2"><b>Problema ou sugestão</b><br><span class="fbsm">Conte o que travou ou dê uma ideia para melhorar o ${FBX.app}</span></span><span class="fbar" aria-hidden="true">›</span></button>`}
function fbAdmin(){const L=FBC.all.filter(Boolean).sort((a,b)=>b.id-a.id),f=L.filter(x=>(!FBU.ft||(x.tipo||'')===FBU.ft)&&(!FBU.fs||(x.st||'nova')===FBU.fs)),n=s=>L.filter(x=>(x.st||'nova')===s).length;
  return `<div class="fbadm"><div class="fbchips" role="group" aria-label="Filtrar por tipo">${[['','Todos os tipos']].concat(FB_T).map(([k,l])=>`<button type="button" class="fbchip" data-fbft="${k}" aria-pressed="${FBU.ft===k}">${l}</button>`).join('')}</div><div class="fbchips" role="group" aria-label="Filtrar por situação">${[['','Todas']].concat(Object.entries(FB_S)).map(([k,l])=>`<button type="button" class="fbchip" data-fbfs="${k}" aria-pressed="${FBU.fs===k}">${l}${k?' ('+n(k)+')':''}</button>`).join('')}</div>
${f.length?f.slice(0,60).map(x=>{const st=x.st||'nova';return `<div class="card fbit" style="padding:14px;margin-top:10px"><div class="fbh"><span class="fbtag">${fbTL(x.tipo)}</span><span class="fbst fbst-${st}">${FB_S[st]}</span>${x.resp?'<span class="fbtag">Quer resposta</span>':''}</div>${x.name?`<p><b>${fbE(x.name)}</b></p>`:''}<p>${fbE(String(x.text||x.tx||'').slice(0,800))}</p>${x.img?`<a class="fbthumb" href="${x.img}" target="_blank" rel="noopener"><img src="${x.img}" alt="Print enviado"></a>`:''}<p class="fbsm">Protocolo ${fbProt(x)} · ${fbDt(x.at)}${x.tela?' · tela: '+fbE(x.tela):''}</p>
<div class="fbrow">${Object.entries(FB_S).map(([k,l])=>`<button type="button" data-fbst="${k}" data-id="${x.id}" data-uid="${fbE(x.uid)}" aria-pressed="${st===k}">${l}</button>`).join('')}</div>
<label class="fblab" for="fbr-${x.id}" style="margin-top:10px">Resposta para a pessoa</label><textarea id="fbr-${x.id}" rows="2" maxlength="500" placeholder="Ex.: Obrigado! Já corrigimos.">${fbE(x.rep||'')}</textarea><div class="fbrow"><button type="button" data-fbrep="${x.id}" data-uid="${fbE(x.uid)}">${x.rep?'Atualizar resposta':'Responder'}</button></div></div>`}).join(''):'<div class="card" style="margin-top:10px"><b>Nenhuma mensagem aqui</b></div>'}</div>`}
function fbRefresh(){const b=document.getElementById('fbbox');if(!b)return;const t=document.getElementById('fbtx'),v=t?t.value:'';b.outerHTML=fbForm();const t2=document.getElementById('fbtx');if(t2)t2.value=v}
function fbUpd(id,fn,uid){if(!FBC.db||!FBC.adm)return;const L=FBC.all.filter(y=>y.uid===uid).map(({uid:_,...y})=>({...y})),x=L.find(y=>String(y.id)===String(id));if(!x)return;fn(x);FBC.db.doc('fb/'+uid).set({items:L}).then(()=>FBX.toast('Salvo.')).catch(()=>FBX.toast('Não foi possível salvar agora.'))}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-fbt],[data-fbx],[data-fbft],[data-fbfs],[data-fbst],[data-fbrep],[data-fbtab]');if(!b)return;e.preventDefault();e.stopPropagation();const D=b.dataset;
  if(D.fbt){FBU.t=D.fbt;FBU.msg='';fbRefresh();return}
  if(D.fbft!==undefined){FBU.ft=D.fbft;FBX.after();return}
  if(D.fbfs!==undefined){FBU.fs=D.fbfs;FBX.after();return}

    const me={},r={id:Date.now(),app:FBX.app,tipo:FBU.t,text:tx.slice(0,800),img:FBU.img||'',resp:FBU.resp,email:me.email||'',name:me.name||'',pk:me.pk||'',tela:FBX.tela?FBX.tela():'',st:'nova',at:new Date().toISOString()};

    if(Date.now()-(FBU.last||0)<20000){if(m)m.textContent='Aguarde alguns segundos para enviar outra mensagem.';return}FBU.last=Date.now();
    const items=[...FBC.my,r].slice(-30).map((x,i,A)=>i<A.length-5&&x.img?{...x,img:''}:x);if(m)m.textContent='Enviando…';
    FBC.db.doc('fb/'+FBC.uid).set({items}).then(()=>{FBC.my=items;FBU.img='';FBU.msg='Recebemos, obrigado! Protocolo nº '+fbProt(r)+'.'+(FBU.resp?' A resposta aparece em "Minhas mensagens", aqui embaixo.':'');FBU.mo=false;const t2=document.getElementById('fbtx');if(t2)t2.value='';fbRefresh()}).catch(()=>{FBU.last=0;const m2=document.getElementById('fbmsg');if(m2)m2.textContent='Não consegui enviar agora. Tente de novo.'});return}
},true);
document.addEventListener('change',e=>{const t=e.target;if(!t)return;
  if(t.id==='fbresp'){FBU.resp=t.checked;return}

},true);
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='fbmine')FBU.mo=e.target.open},true);

  el.innerHTML=`<div class="fbbg" data-fbx="close"></div><div class="fbsh" role="dialog" aria-modal="true" aria-label="Problema ou sugestão"><div class="fbtop"><button type="button" class="fbclose" data-fbx="close" aria-label="Fechar">Fechar</button>${FBC.adm?`<div class="fbchips" style="margin:0"><button type="button" class="fbchip" data-fbtab="me" aria-pressed="${!FBU.av}">Enviar</button><button type="button" class="fbchip" data-fbtab="adm" aria-pressed="${!!FBU.av}">Recebidas${na?' ('+na+' novas)':''}</button></div>`:''}</div>${FBU.av&&FBC.adm?'<b style="font-size:18px">Problemas e sugestões recebidos</b>'+fbAdmin():fbForm()}</div>`;
  const t2=document.getElementById('fbtx');if(t2)t2.value=tx;const s2=el.querySelector('.fbsh');if(s2)s2.scrollTop=y}

  if(FBC.adm)db.collection('fb').onSnapshot(sn=>{FBC.all=[];sn.docs.forEach(d=>{const v=d.data()||{};(Array.isArray(v.items)?v.items:[]).forEach(x=>FBC.all.push({...x,uid:d.id}))});FBX.after()},()=>{})}catch(_){}}

const lk=document.getElementById('fblk');if(lk)lk.innerHTML=fbLink();
})();
