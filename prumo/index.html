function empty(){return{demo:false,mei:{act:'serv',open:'',nome:'',cnpj:'',cidade:'',rev:[],exp:[],das:{}},debts:[],budget:0,metodo:'rec',goals:[],orc:null}}

   DB=['Cartão Banco Azul','Cheque especial','Financiamento da moto','Loja de móveis Bom Lar','Conta de luz atrasada'],GN=['Viagem para Jericoacoara','Reserva de emergência','Escada e furadeira novas'],GG=[['Mercado do mês',382.4],['Combustível',210],['Farmácia',118.9],['Camisa',59.9],['Padaria',46.5],['Pizza com a família',92]];
  const m=o.mei||{};m.rev=(m.rev||[]).filter(r=>!(CL.includes(r.cli)&&RD.includes(r.desc)));m.exp=(m.exp||[]).filter(r=>!ED.includes(r.desc));

  o.debts=(o.debts||[]).filter(d=>!DB.includes(d.cred));o.goals=(o.goals||[]).filter(g=>!GN.includes(g.nome));if(o.budget===1900)o.budget=0;
  if(o.orc){o.orc.gastos=(o.orc.gastos||[]).filter(g=>!GG.some(x=>x[0]===g.t&&Math.abs(x[1]-g.v)<0.01));if(o.orc.renda===6800&&o.orc.pessoas===3&&o.orc.fix&&o.orc.fix.moradia===1500&&o.orc.fix.alim===1100){o.orc.renda=0;o.orc.fix={}}}
  o.demo=false}catch(e){o.demo=false}return o}
function load(){try{const t=localStorage.getItem(K);if(t){let o=JSON.parse(t);if(o&&o.mei&&o.debts){o=semExemplo(o);if(!o.goals)o.goals=[];if(o.orc===undefined)o.orc=null;if(o.orc&&!o.orc.gastos)o.orc.gastos=[];return o}}}catch(e){}return null}
const GUEST=!!(window.IA_AUTH&&!IA_AUTH.logado());
let S=load()||empty();
const SYNC={db:null,ref:null,st:'local',tm:null,warn:false,
  label(){return this.st==='cloud'?'Salvo na conta':this.st==='busy'?'Salvando…':''}};
const IDB={db:null,op(){return this.db||(this.db=new Promise((ok,no)=>{try{const r=indexedDB.open('prumo_arq',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))},
  async set(k,v){const d=await this.op();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  async get(k){const d=await this.op();return new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result||'');q.onerror=()=>no(q.error)})},
  async del(k){const d=await this.op();return new Promise(ok=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}};
let SAVEERR=0;
function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S));SAVEERR=0}catch(e){if(!SAVEERR){SAVEERR=1;toast('⚠️ Não consegui salvar neste aparelho: a memória dos apps está cheia. Toque em “Liberar espaço” no aviso vermelho.')}}cloudPush()}
/* Arquivos de contrato saem do localStorage (5 MB, dividido com os outros apps) e vão para o IndexedDB, que tem muito mais espaço */
(async()=>{try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('pr_ct_local_'))ks.push(k)}let n=0;for(const k of ks){const v=localStorage.getItem(k);if(v){await IDB.set(k,v);localStorage.removeItem(k);n++}}if(n)try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}}catch(_){}})();
function cloudPush(now){if(!SYNC.ref||S.demo)return;clearTimeout(SYNC.tm);SYNC.st='busy';paintWho();
  SYNC.tm=setTimeout(cloudFlush,now?0:1200)}
async function cloudFlush(){if(!SYNC.ref||S.demo)return;let j;try{j=JSON.stringify(S)}catch(e){return}
  if(j.length>240000){SYNC.st='local';paintWho();if(!SYNC.warn){SYNC.warn=true;toast('Seus dados ficaram grandes demais para a conta; continuam salvos só neste aparelho.')}return}

function paintWho(){const w=$('#who');if(w&&!S.demo)w.textContent=SYNC.label()}
async function cloudInit(){try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const id=await user.id();if(!id)return;SYNC.ref=db.collection('data/users/'+id).doc('prumo');

  const nIt=o=>{try{const m=o.mei||{};return (m.rev||[]).length+(m.exp||[]).length+(o.debts||[]).length+(o.goals||[]).length+((o.orc&&o.orc.gastos)||[]).length+((o.casa&&o.casa.gastos)||[]).length}catch(_){return 0}};
  let own='';try{own=localStorage.getItem('prumo_owner')||''}catch(_){}
  if(own&&own!==id){S=r||empty();if(!r)S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem('prumo_owner',id)}catch(e){}
    SYNC.st='cloud';render(true);if(r)toast('Seus dados foram carregados da sua conta.');else{toast('Conta nova: você começa do zero.');await cloudFlush()}return}
  try{localStorage.setItem('prumo_owner',id)}catch(_){}
  if(r&&(S.demo||(r.t||0)>(S.t||0)||(nIt(S)===0&&nIt(r)>0))){S=r;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}SYNC.st='cloud';render(true);toast('Seus dados foram carregados da sua conta.');return}
  if(!S.demo){S.t=S.t||Date.now();await cloudFlush()}else{SYNC.st='cloud';paintWho()}
}catch(e){}}

/* Mais de uma aba/janela do Prumo aberta: a que estava parada não pode apagar o que a outra salvou */
function syncAbas(raw){try{const o=JSON.parse(raw);if(o&&o.mei&&o.debts&&(o.t||0)>(S.t||0)){S=o;if(!S.goals)S.goals=[];if(S.orc===undefined)S.orc=null;if(S.orc&&!S.orc.gastos)S.orc.gastos=[];try{render(true)}catch(_){}}}catch(_){}}

const UI={tab:'inicio',neg:'resumo',div:'visao',met:'lista',plan:null,dream:null,gf:null,gb:false,sel:null,ai:{}};

/* ---------- cálculos do MEI ---------- */
const yearOf=d=>d.slice(0,4);
function meiCalc(){
  const m=S.mei,revY=m.rev.filter(r=>yearOf(r.d)==Y),expY=m.exp.filter(r=>yearOf(r.d)==Y);
  const tot=revY.reduce((a,r)=>a+r.v,0),totExp=expY.reduce((a,r)=>a+r.v,0);
  let lim=REF.limite,prop=false;
  if(m.open&&m.open.slice(0,4)==String(Y)){const mo=+m.open.slice(5,7);lim=REF.limMes*(12-mo+1);prop=true}
  if(m.porte==='me'||m.porte==='epp'){const A=m.porte==='me'?REF.limME:REF.limEPP;lim=A;prop=false;if(m.open&&m.open.slice(0,4)==String(Y)){lim=A/12*(12-(+m.open.slice(5,7))+1);prop=true}}
  const el=M+TODAY.getDate()/new Date(Y,M+1,0).getDate(),avg=el>0?tot/el:0,left=Math.max(0,12-el);
  const pct=lim?tot/lim*100:0,room=lim-tot;
  const byM=Array.from({length:12},(_,i)=>({r:0,e:0}));
  revY.forEach(r=>byM[+r.d.slice(5,7)-1].r+=r.v);expY.forEach(r=>byM[+r.d.slice(5,7)-1].e+=r.v);
  let fol=0;flD().pag.forEach(g=>{if(String(g.mes).slice(0,4)===String(Y)){const i=+g.mes.slice(5,7)-1,v=(+g.base||0)+(+g.extra||0);if(i>=0&&i<12){byM[i].e+=v;fol+=v}}});
  retD().forEach(x=>{if(/Pró-labore/.test(x.t||'')&&String(x.d).slice(0,4)===String(Y)){const i=+x.d.slice(5,7)-1,v=+x.v||0;if(i>=0&&i<12){byM[i].e+=v;fol+=v}}});
  return{tot,totExp:totExp+fol,fol,lim,prop,avg,left,pct,room,proj:avg*12,perMonthLeft:left>0?Math.max(0,room)/left:0,byM,lucroMes:byM[M].r-byM[M].e,
    lucro3:[1,2,3].map(k=>M-k).filter(i=>i>=0).map(i=>byM[i].r-byM[i].e)}
}
function dasList(){
  const m=S.mei,val=REF.das[m.act]||REF.das.serv,out=[];
  for(let i=0;i<=M;i++){const key=Y+'-'+pad(i+1),due=new Date(Y,i+1,20),dueIso=iso(due),paid=!!m.das[key],d=daysTo(dueIso);
    out.push({key,i,due:dueIso,d,paid,val,st:paid?'paga':d<0?'atrasada':d<=10?'vence':'aberta'})}
  return out;
}
function meiAlerts(){

  if(!isMei()){if(c.pct>=80)a.push({k:c.pct>=100?'bad':'warn',t:c.pct>=100?'Você passou do limite do Simples':'Você usou '+Math.round(c.pct)+'% do limite',d:'Sobram '+brl0(c.room)+' até dezembro.',go:['negocio','resumo']});return a}

  const nx=L.filter(x=>!x.paid&&x.d>=0).sort((p,q)=>p.d-q.d)[0];if(nx)a.push({k:nx.d<=7?'warn':'info',t:'Guia de '+MES[nx.i]+' vence dia '+fd(nx.due).slice(0,5),d:nx.d===0?'Vence hoje.':'Faltam '+nx.d+' dias. Valor de referência: '+brl(nx.val)+'.',go:['negocio','guia']});

/* ---------- dívidas ---------- */
const TIPOS={cartao:'Cartão de crédito',banco:'Banco ou empréstimo',loja:'Loja ou crediário',financiamento:'Financiamento (com bem)',conta:'Conta de consumo (luz, água, telefone)',outro:'Outra'};
const eff=d=>d.acordo?{...d,saldo:d.acordo.total,juros:0,min:d.acordo.total/d.acordo.parc}:d;
function order(debts,metodo){
  const L=debts.map(eff).filter(d=>d.saldo>0.005);
  const av=(a,b)=>b.juros-a.juros;
  if(metodo==='snow')return L.sort((a,b)=>a.saldo-b.saldo);
  if(metodo==='aval')return L.sort(av);
  return L.sort((a,b)=>(b.ess-a.ess)||av(a,b));
}
function sim(debts,budget,metodo){
  const ord=order(debts,metodo),bal={};ord.forEach(d=>bal[d.id]=d.saldo);
  let m=0,juros=0;const end={};
  while(m<600&&ord.some(d=>bal[d.id]>0.005)){
    m++;ord.forEach(d=>{if(bal[d.id]>0){const i=bal[d.id]*d.juros/100;bal[d.id]+=i;juros+=i}});
    let left=budget;
    ord.forEach(d=>{if(bal[d.id]>0){const p=Math.min(d.min||0,bal[d.id],left);bal[d.id]-=p;left-=p}});
    ord.forEach(d=>{if(left>0&&bal[d.id]>0){const p=Math.min(bal[d.id],left);bal[d.id]-=p;left-=p}});
    ord.forEach(d=>{if(bal[d.id]<=0.005&&end[d.id]==null)end[d.id]=m});
  }
  return{ord,months:m,ok:m<600,juros,end};
}
const monthAfter=n=>{const d=new Date(Y,M+n,1);return MES[d.getMonth()]+' de '+d.getFullYear()};
function why(d){
  d=eff(d);const r=[];
  if(d.ess)r.push('Serviço essencial: atrasar pode levar ao corte.');
  if(d.tipo==='financiamento'&&d.atraso>0)r.push('Tem um bem como garantia (pode ser retomado).');
  if(d.juros>=8)r.push('Juros altos: '+String(d.juros).replace('.',',')+'% ao mês.');
  else if(d.juros>=4)r.push('Juros médios: '+String(d.juros).replace('.',',')+'% ao mês.');
  if(d.neg)r.push('Está com o nome negativado.');
  if(d.atraso>60)r.push('Atrasada há '+d.atraso+' dias.');
  if(!r.length)r.push('Sem urgência especial.');
  return r.join(' ');
}

function chart(c){
  const W=340,H=150,pl=34,pb=18,pt=8,mx=Math.max(1,...c.byM.map(b=>Math.max(b.r,b.e)))*1.1,bw=(W-pl)/12;
  const y=v=>pt+(H-pb-pt)*(1-v/mx),ticks=[0,.5,1].map(f=>mx*f/1.1);
  let g=ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t/1000)+' mil':Math.round(t)}</text>`).join('');
  c.byM.forEach((b,i)=>{const x=pl+i*bw;g+=`<rect x="${x+3}" y="${y(b.r)}" width="${bw/2-3}" height="${Math.max(0,H-pb-y(b.r))}" rx="2" fill="var(--mei)"/><rect x="${x+bw/2}" y="${y(b.e)}" width="${bw/2-3}" height="${Math.max(0,H-pb-y(b.e))}" rx="2" fill="var(--muted)" opacity=".55"/><text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${MS[i][0].toUpperCase()}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês em ${Y}">${g}</svg><div class="row small muted"><span><b style="color:var(--mei)">■</b> Receitas</span><span><b style="color:var(--muted)">■</b> Despesas</span></div>`;
}

function pyTaxasApply(j){if(!j)return;const mes=d=>{const m=String(d||'').split('/');return m.length===3?MES[(+m[1]||1)-1]+' de '+m[2]:''};
  if(j.selic&&j.selic.v>0){REFJ.selic=j.selic.v;REFJ.selicL='atualizada em '+j.selic.data}
  if(j.veicMes&&j.veicMes.v>0){REFJ.veic=j.veicMes.v;REFJ.veicD=mes(j.veicMes.data)||REFJ.veicD}
  if(j.veicAno&&j.veicAno.v>0){REFJ.veicA=j.veicAno.v;if(!(j.veicMes&&j.veicMes.v>0))REFJ.veic=Math.round((Math.pow(1+j.veicAno.v/100,1/12)-1)*10000)/100;REFJ.veicD=mes(j.veicAno.data)||REFJ.veicD}}
(function(){const KT='prumo_taxas';let c=null;try{c=JSON.parse(localStorage.getItem(KT)||'null')}catch(_){}
  if(c&&c.j)pyTaxasApply(c.j);
  const base=window.IA_URL;if(!base||(c&&Date.now()-c.t<432e5))return;
  fetch(String(base).replace(/\/$/,'')+'/taxas').then(r=>r.ok?r.json():null).then(j=>{if(!j||j.erro)return;pyTaxasApply(j);try{localStorage.setItem(KT,JSON.stringify({t:Date.now(),j}))}catch(_){}if(UI.paySh)render(true)}).catch(()=>{})})();

const anoTx=i=>(Math.pow(1+i/100,12)-1)*100,pctS=v=>String(Math.round(v*100)/100).replace('.',',');
function finCalc(F,i,n,sis){if(!(F>0))return{pm1:0,pmL:0,tf:0,jur:0};if(sis==='sac'){const a=F/n;return{pm1:a+F*i,pmL:a+a*i,tf:F+i*F*(n+1)/2,jur:i*F*(n+1)/2}}const pm=i>0?F*i/(1-Math.pow(1+i,-n)):F/n;return{pm1:pm,pmL:pm,tf:pm*n,jur:Math.max(0,pm*n-F)}}

   ${pyRow('Total pago nas parcelas',brl0(C.tf))}${pyRow('Total de juros',brl0(C.jur))}${pyRow('O '+b+' sai por (entrada + parcelas)',brl0(C.tf+C.E),'tt')}${pyRow('A mais que à vista',brl0(Math.max(0,mais)))}</div>`}

    const d=await prepDoc(file);

  let big=null;GM.forEach(g=>{if(g.d>=ini&&g.d<=TODAYISO){ws[g.c]=(ws[g.c]||0)+(+g.v||0);wt+=(+g.v||0);if(GRITMO.includes(g.c)&&(!big||g.v>big.v))big=g}});
  let proj=0;const por=[];

}

const shareOf=g=>myOwn().find(x=>x.gid===g.id);
let CPIMG='';const CPV={};
function cpShrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>150000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);d.length<=190000?ok(d):no()}catch(e){no(e)}};im.onerror=no;im.src=u})}

function snap(g,prev){let total=+g.alvo||0,mem=[];

  const o={...(prev||{}),gid:g.id,nome:String(g.nome||'Meta').slice(0,60),tipo:g.tipo||'outro',prazo:g.prazo||'',total:r2(total),gu:r2(g.guardado),mem:mem.slice(0,40),ctr:(g.ctr||[]).slice(0,20).map(c=>({id:c.id,t:c.t,q:c.q,v:c.v,d:c.d,o:c.o,ft:c.ft,n:c.n}))};
  delete o.full;try{const F=JSON.stringify(fullOf(g));if(F.length<150000)o.full=F}catch(_){}return o}
const PRIV=['id','guardado','aportes','dep','pago','dpag','start','t','ts'];
function fullOf(g){const o={};Object.keys(g).forEach(k=>{if(!PRIV.includes(k)&&k[0]!=='_')o[k]=g[k]});return o}

const NIVK={1:['rota','custos','alvo','imprev','extra','dias'],2:['rota','custos','alvo','imprev','extra','dias','membros','npes']};
const podeK=(lv,k)=>lv>=3?!PRIV.includes(k)&&k[0]!=='_':(NIVK[lv]||[]).includes(k);

const SUBL={dest:'destino',orig:'origem',noites:'noites',adultos:'adultos',idades:'idades das crianças',km:'distância',preco:'preço do combustível',cons:'consumo do carro',dia:'diária',quartos:'quartos',ref:'refeição',mlE:'refeições na estrada',mlD:'refeições no destino',mpE:'preços na estrada',mpD:'preços no destino',ped:'pedágios',hotE:'hotel no caminho',dIda:'dias de ida',dVolta:'dias de volta',modo:'meio de transporte',pass:'passagens',pas:'passeios'};
function difTxt(a,b,k){const A=a&&a[k],B=b&&b[k];if(JSON.stringify(A)===JSON.stringify(B))return '';const nm=LAB[k]||k;
  if(k==='membros'){const na=(A||[]).map(m=>String(m.nome||'')),nb=(B||[]).map(m=>String(m.nome||''));const ad=nb.filter(x=>!na.includes(x)),rm=na.filter(x=>!nb.includes(x));return nm+(ad.length?' (entrou: '+ad.join(', ')+')':'')+(rm.length?' (saiu: '+rm.join(', ')+')':'')+(!ad.length&&!rm.length?' (dados de quem vai)':'')}
  if(A&&B&&typeof A==='object'&&typeof B==='object'&&!Array.isArray(A)){const ks=[...new Set([...Object.keys(A),...Object.keys(B)])].filter(x=>JSON.stringify(A[x])!==JSON.stringify(B[x])).map(x=>SUBL[x]||x);return nm+(ks.length?' ('+ks.slice(0,6).join(', ')+(ks.length>6?'…':'')+')':'')}
  if(typeof B==='number'||typeof A==='number')return nm+' ('+(A==null?'—':brl(+A))+' → '+(B==null?'—':brl(+B))+')';
  if(typeof B==='string'&&B.length<40)return nm+' ('+(A||'—')+' → '+B+')';return nm}
function aplicaEd(){if(!ready()||S.demo)return false;const L=myOwn();let mud=false;
  L.forEach((x,i)=>{const g=S.goals.find(y=>y.id===x.gid);if(!g)return;const ap={...(x.ap||{})},log=(x.log||[]).slice();let tocou=false;

      const tx=feitos.map(k=>difTxt(ant,g,k)).filter(Boolean);if(tx.length)log.push({ts:e.ts,nk:j.nick||'Convidado',t:'alterou: '+tx.join('; ')});if(neg.length)log.push({ts:e.ts,nk:j.nick||'Convidado',t:'não pôde alterar (sem permissão): '+neg.join(', '),neg:1});if(feitos.length)mud=true})});
    if(tocou){L[i]=snap(g,{...x,ap,log:log.slice(-60)});mud=true}});

(function(){
const LBK='prumo_lbo';
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function lbD(g){if(!g.lemb||typeof g.lemb!=='object')g.lemb={on:false,dia:'',v:'',ant:1};return g.lemb}
function lbNeed(g){try{const T=planTotals(g),tot=T.total>0?T.total:(+g.alvo||0),f=Math.max(0,tot-(+g.guardado||0)),m=Math.max(1,Math.ceil(daysTo(g.prazo)/30.44));return f/m}catch(_){return 0}}

function mesAp(g,y,m){const k=y+'-'+pad(m+1);return (g.aportes||[]).filter(a=>a&&String(a.d).slice(0,7)===k).reduce((s,a)=>s+(+a.v||0),0)}
function nextAp(g){const L=lbD(g);if(!L.on||!(+L.dia>=1))return null;const v=lbVal(g),d=Math.min(+L.dia,28);
  const pago=mesAp(g,Y,M)>=Math.max(1,v*0.95-0.5);let y=Y,m=M;if(pago){m++;if(m>11){m=0;y++}}
  const di=Math.min(d,dim(y,m)),dt=y+'-'+pad(m+1)+'-'+pad(di);if(g.prazo&&dt>g.prazo&&!(!pago&&dt<=TODAYISO))return null;
  return{dt,dias:daysTo(dt),v,pago}}
window.lembDue=function(g){const out=[],L=lbD(g),ant=+L.ant||0,n=nextAp(g);
  if(n&&n.dias<=ant)out.push({k:'ap',id:g.id+':ap:'+n.dt,t:n.dias<0?'Aporte atrasado':n.dias===0?'Hoje é dia do aporte':'Aporte em '+n.dias+(n.dias===1?' dia':' dias'),d:n.dt,dias:n.dias,v:n.v});
  (g.comp||[]).forEach(c=>{if(c.ok||!c.d)return;const dd=daysTo(c.d);if(dd<=Math.max(ant,1))out.push({k:'cp',id:g.id+':cp:'+c.id,t:(dd<0?'Atrasado: ':dd===0?'Hoje: ':'Em '+dd+(dd===1?' dia: ':' dias: '))+c.t,d:c.d,dias:dd,v:+c.v||0})});
  return out};
function lbStatus(g){const n=nextAp(g),L=lbD(g);if(!L.on)return 'desligado';if(!n)return +L.dia>=1?'em dia':'escolha o dia';
  return n.dias<0?'atrasado':n.dias===0?'hoje':'em '+n.dias+(n.dias===1?' dia':' dias')}
const ntSt=()=>typeof Notification==='undefined'?'none':Notification.permission;
window.lembBox=function(g){const L=lbD(g),need=lbNeed(g),n=nextAp(g),C=(g.comp||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d))),o=(UI.lbo||{})[g.id],ns=ntSt();
  const due=lembDue(g),al=due.map(x=>`<div class="lb-al${x.dias<0?' late':''}"><span>🔔 ${esc(x.t)}${x.v>0?' · '+brl0(x.v):''}</span>${x.k==='ap'?`<button class="btn meta sm" data-gr="dep" data-lbv="${Math.round(x.v)}">Lançar agora</button>`:`<button class="btn ghost sm" data-lbok="${esc(x.id.split(':cp:')[1])}">Feito</button>`}</div>`).join('');
  return `${al}<details class="grs-fold grs-lb" data-lbg="${g.id}"${o?' open':''}><summary>🔔 Lembretes e compromissos<span class="lbs">${lbStatus(g)}</span></summary><div class="lb-in">
   <button type="button" class="lb-sw" role="switch" aria-checked="${!!L.on}" data-lbon="${g.id}"><span>Me avisar do aporte todo mês</span><i></i></button>
   ${L.on?`<div class="lb-g3"><label>Dia do mês<input inputmode="numeric" maxlength="2" data-lb="dia" value="${L.dia||''}" placeholder="1 a 28"></label><label>Valor do aporte (R$)<input inputmode="decimal" data-lb="v" value="${+L.v>0?String(L.v).replace('.',','):''}" placeholder="${brl0(need).replace('R$','').trim()}"></label><label>Avisar<select data-lb="ant">${[[0,'No dia'],[1,'1 dia antes'],[2,'2 dias antes'],[3,'3 dias antes'],[5,'5 dias antes']].map(([v,l])=>`<option value="${v}"${(+L.ant||0)===v?' selected':''}>${l}</option>`).join('')}</select></label></div>
   <div class="lb-nx">${n?(n.pago&&n.dias>0?'✅ Aporte deste mês já feito. ':'')+`Próximo aporte: <b>${fd(n.dt)}</b>${n.dias>0?' (em '+n.dias+(n.dias===1?' dia)':' dias)'):n.dias===0?' (hoje)':' (atrasado)'} · <b class="num">${brl0(n.v)}</b>`:+L.dia>=1?'Sem próximos aportes até o prazo.':'Escolha o dia do mês em que você costuma guardar, por exemplo o dia em que recebe.'}</div>`:''}
   <b style="font-size:14px">Compromissos da meta</b><span class="muted small" style="margin-top:-6px">Datas importantes para chegar lá: pagar um sinal, uma parcela, uma reserva.</span>
   ${C.length?`<div class="lb-cp">${C.map(c=>`<div class="${c.ok?'ok':''}"><span style="min-width:0"><b style="overflow-wrap:anywhere">${esc(c.t)}</b><br><span class="muted small">${c.d?fd(c.d):'sem data'}${+c.v>0?' · '+brl0(+c.v):''}${!c.ok&&c.d&&daysTo(c.d)<0?' · atrasado':''}</span></span><span style="flex:none"><button class="x" data-lbok="${c.id}">${c.ok?'Desfazer':'Feito'}</button><button class="x" data-lbdel="${c.id}" aria-label="Apagar ${esc(c.t)}">Apagar</button></span></div>`).join('')}</div>`:''}
   <div class="lb-add"><input class="w" id="lb-ct" maxlength="60" placeholder="Ex.: Pagar o sinal do buffet"><input id="lb-cd" type="date" min="${TODAYISO}" aria-label="Data do compromisso"><input id="lb-cv" inputmode="decimal" placeholder="Valor (opcional)" aria-label="Valor do compromisso"><button class="btn ghost sm w" data-lbadd="${g.id}">Adicionar compromisso</button></div>
   <div class="row"><button class="btn ghost sm" data-lbics="${g.id}">📅 Pôr na agenda do celular</button>${ns==='none'?'':`<button class="btn ghost sm" data-lbnt="1"${ns==='granted'||ns==='denied'?' disabled':''}>${ns==='granted'?'🔔 Avisos no celular ligados':ns==='denied'?'🔕 Avisos bloqueados no celular':'🔔 Ligar avisos no celular'}</button>`}</div>
   <p class="muted small" style="margin:0">O Prumo avisa aqui e no Início quando o dia estiver perto. ${ns==='granted'?'Com os avisos ligados, ele também avisa pelo celular quando você abre o app.':''} Para ser lembrado mesmo sem abrir o app, toque em "Pôr na agenda do celular".${ns==='denied'?' Para liberar os avisos, mude a permissão de notificações nas configurações do navegador.':''}</p>
  </div></details>`};
/* Início: compromissos e aportes perto do dia entram em "O que fazer agora" */
if(typeof goalTasks==='function'){const _gt=goalTasks;goalTasks=function(){const L=[];(S.goals||[]).forEach(g=>{try{lembDue(g).forEach(x=>L.push({k:(x.dias<=0?'warn':'info')+' meta',t:x.t+' · '+g.nome,d:(x.v>0?brl0(x.v)+' · ':'')+fd(x.d),go:['metas','','plan:'+g.id]}))}catch(_){}});return L.concat(_gt())}}
/* agenda do celular (.ics) */
function icsTx(s){return String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function icsD(s){return s.replace(/-/g,'')}
function ics(g){const L=lbD(g),ant=+L.ant||0,st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),ev=[];
  const al=t=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsTx(t)}\r\nTRIGGER:${ant?'-P'+ant+'D':'PT0M'}\r\nEND:VALARM`+(ant?`\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsTx(t)}\r\nTRIGGER:PT0M\r\nEND:VALARM`:'');
  const n=nextAp(g);
  if(L.on&&n){const t='💰 Aporte da meta: '+g.nome+' ('+brl0(n.v)+')',d=Math.min(+L.dia,28),until=g.prazo?';UNTIL='+icsD(g.prazo)+'T235959':'';
    ev.push(`BEGIN:VEVENT\r\nUID:prumo-ap-${g.id}@prumo\r\nDTSTAMP:${st}\r\nDTSTART:${icsD(n.dt)}T090000\r\nDTEND:${icsD(n.dt)}T091500\r\nRRULE:FREQ=MONTHLY;BYMONTHDAY=${d}${until}\r\nSUMMARY:${icsTx(t)}\r\nDESCRIPTION:${icsTx('Guardar '+brl0(n.v)+' para a meta "'+g.nome+'". Depois, lance no Prumo.')}\r\n${al(t)}\r\nEND:VEVENT`)}
  (g.comp||[]).filter(c=>!c.ok&&c.d&&c.d>=TODAYISO).forEach(c=>{const t='📌 '+c.t+(+c.v>0?' ('+brl0(+c.v)+')':'');
    ev.push(`BEGIN:VEVENT\r\nUID:prumo-cp-${g.id}-${c.id}@prumo\r\nDTSTAMP:${st}\r\nDTSTART:${icsD(c.d)}T090000\r\nDTEND:${icsD(c.d)}T091500\r\nSUMMARY:${icsTx(t)}\r\nDESCRIPTION:${icsTx('Compromisso da meta "'+g.nome+'" no Prumo.')}\r\n${al(t)}\r\nEND:VEVENT`)});
  if(!ev.length)return null;
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Prumo//Metas//PT\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`}
/* avisos no celular: mostra uma vez por dia por compromisso, quando o app está aberto */
async function notify(){if(ntSt()!=='granted')return;let reg=null;try{reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration()}catch(_){}
  (S.goals||[]).forEach(g=>{let L=[];try{L=lembDue(g)}catch(_){}L.forEach(x=>{const k='prumo_ln_'+x.id+'_'+TODAYISO;try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1')}catch(_){return}
    const ti='Prumo: '+x.t,bo=g.nome+(x.v>0?' · '+brl0(x.v):'');
    try{if(reg&&reg.showNotification)reg.showNotification(ti,{body:bo,icon:'icon-192.png',tag:x.id});else new Notification(ti,{body:bo})}catch(_){}})})}
async function notifyEv(){if(ntSt()!=='granted')return;let reg=null;try{reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration()}catch(_){}
  let L=[];try{L=evTasks().filter(x=>x.nt);(meiAlerts()||[]).forEach(a=>{if(/^Guia de/.test(a.t)&&(a.k==='warn'||a.k==='bad'))L.push({...a,key:'das:'+a.t})})}catch(_){}
  L.forEach(x=>{const k='prumo_ev_'+x.key;try{if(localStorage.getItem(k))return;localStorage.setItem(k,TODAYISO)}catch(_){return}
    const ti='Prumo: '+x.t.replace(/^[^\wÀ-ú"]+/,'');try{if(reg&&reg.showNotification)reg.showNotification(ti,{body:x.d,icon:'icon-192.png',tag:x.key});else new Notification(ti,{body:x.d})}catch(_){}})}
setTimeout(notify,2500);setInterval(notify,30*60*1000);setTimeout(notifyEv,3500);setInterval(notifyEv,60*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)notifyEv()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)notify()});
/* eventos */
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.lbg){UI.lbo=UI.lbo||{};UI.lbo[d.dataset.lbg]=d.open}},true);

document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-lbon],[data-lbadd],[data-lbok],[data-lbdel],[data-lbics],[data-lbnt],[data-sel^="plan:"]');if(!b)return;

window.ccCard=()=>{const C=CC(),cards=C.cards,ab=aberto(),tot=sum(ab),op=window.__ccOp;
  const lim=cards.reduce((a,c)=>a+(+c.lim||0),0);
  const perCard=cards.map(c=>{const L=aberto(c.n),u=sum(L),pc=c.lim>0?Math.min(100,Math.round(u/c.lim*100)):0;return `<div style="display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)"><div class="row sp"><b>💳 ${esc(c.n)}</b><b class="num">${brl(u)}</b></div>${c.lim>0?`<div class="bar ${pc>=90?'bad':pc>=70?'warn':''}" style="height:8px;border-radius:9px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:${pc}%;background:${pc>=90?'var(--bad)':pc>=70?'#E8A33A':'var(--mei)'}"></i></div><span class="muted small">${pc}% do limite de ${brl0(c.lim)} · livre ${brl0(Math.max(0,c.lim-u))}${c.fecha?' · fecha dia '+c.fecha:''}</span>`:`<span class="muted small">${c.fecha?'Fecha dia '+c.fecha+' · ':''}sem limite informado</span>`}
    ${L.length?`<details class="fold"><summary class="small">Ver compras em aberto (${L.length})</summary>${L.slice().sort((a,b)=>String(b.d).localeCompare(String(a.d))).map(g=>`<div class="row sp" style="padding:4px 0"><span class="small">${fd(g.d)} · ${esc(g.desc)} <span class="muted">· ${esc(cCat(g.cat))}</span></span><span class="row" style="gap:6px"><b class="small num">${brl(g.v)}</b><button class="btn ghost sm" data-ccdel="${g.id}" aria-label="Apagar ${esc(g.desc)}" style="min-height:30px;padding:2px 8px">✖</button></span></div>`).join('')}</details>`:''}
    <div class="row"><button class="btn ghost sm" data-ccfat="${esc(c.n)}">Lançar a fatura deste cartão</button></div></div>`}).join('');
  const F=UI.ccFat,fc=F&&cards.find(c=>c.n===F),fu=F?sum(aberto(F)):0;
  return `<details class="card fold" data-ccd${op||UI.ccFat?' open':''}><summary>💳 Cartão de crédito <span class="muted small" style="font-weight:500;margin-left:6px">${tot?'em aberto '+brl0(tot):'acompanhe as compras'}${lim?' · limite '+brl0(lim):''}</span></summary>
  <p class="muted small" style="margin:0">Lance cada compra no crédito para acompanhar quanto já gastou no cartão. Elas entram nos gastos do mês. Quando chegar a fatura, lance o valor de verdade: as compras saem da lista e a diferença (juros, tarifas ou compras esquecidas) vira um ajuste.</p>
  ${fc?`<form class="card" id="ccff" style="border:2px solid var(--mei);gap:8px" novalidate><b>Fatura do ${esc(fc.n)}</b><div class="row sp"><span class="muted small">Compras desta fatura (até hoje)</span><b class="num">${brl(sum(aberto(F).filter(x=>x.d<=TODAYISO||cIn(x.d,MKEY))))}</b></div><label>Valor da fatura (R$)<input id="ccf_v" inputmode="decimal" placeholder="Ex.: 1.250,90" autocomplete="off"></label><label>Vencimento<input id="ccf_d" type="date" value="${TODAYISO}"></label><p class="muted small" id="ccf_x" style="margin:0"></p><div class="row"><button class="btn mei" type="submit">Lançar fatura</button><button class="btn ghost" type="button" data-ccfatx="1">Cancelar</button></div></form>`:''}
  ${perCard||'<p class="muted small" style="margin:0">Nenhum cartão ainda. Cadastre abaixo.</p>'}
  <form id="ccf" style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px" novalidate><b>➕ Lançar compra no cartão</b>
   <div class="grid2"><label>Cartão<select id="cc_c">${cards.map(c=>`<option${UI.ccLast===c.n?' selected':''}>${esc(c.n)}</option>`).join('')}<option value="__novo">+ Novo cartão</option></select></label><label>Valor (R$)<input id="cc_v" inputmode="decimal" placeholder="0,00" autocomplete="off"></label></div>
   <label>O que comprou<input id="cc_t" maxlength="60" placeholder="Ex.: Mercado, farmácia, tênis" autocomplete="off"></label>
   <div class="grid2"><label>Categoria<select id="cc_g"><option value="">Automática</option>${GR.map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Parcelas<select id="cc_p">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i?i+1+'x':'À vista'}</option>`).join('')}</select></label></div>
   <label>Data<input id="cc_d" type="date" value="${TODAYISO}"></label>
   <div id="cc_new" style="display:${cards.length?'none':'grid'};gap:8px" class="grid2"><label>Nome do novo cartão<input id="cc_n" maxlength="24" placeholder="Ex.: Nubank" autocomplete="off"></label><label>Limite (R$, opcional)<input id="cc_l" inputmode="decimal" placeholder="Ex.: 3.000" autocomplete="off"></label><label>Dia que fecha (opcional)<input id="cc_f" inputmode="numeric" placeholder="Ex.: 5" autocomplete="off"></label></div>
   <p class="err" id="cc_e" role="alert" style="margin:0"></p><button class="btn mei" type="submit">Lançar no cartão</button></form>
  ${C.fat.length?`<details class="fold"><summary class="small">Faturas lançadas (${C.fat.length})</summary>${C.fat.slice().reverse().slice(0,24).map(f=>`<div class="row sp" style="padding:4px 0"><span class="small">${fd(f.d)} · ${esc(f.card)}<br><span class="muted">compras ${brl(f.comp)} · ajuste ${f.dif>=0?'+':'−'}${brl(Math.abs(f.dif))}</span></span><b class="small num">${brl(f.v)}</b></div>`).join('')}</details>`:''}
  </details>`};
const num=v=>{const n=Number(String(v||'').replace(/\s|R\$/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isFinite(n)?n:0};
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details[data-ccd]'))window.__ccOp=d.open},true);
document.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='cc_c'){const b=document.getElementById('cc_new');if(b)b.style.display=t.value==='__novo'?'grid':'none'}},true);
document.addEventListener('input',e=>{const t=e.target;if(t&&t.id==='ccf_v'){const F=UI.ccFat,x=document.getElementById('ccf_x');if(!x)return;const dd=(document.getElementById('ccf_d')||{}).value||TODAYISO,v=num(t.value),u=sum(aberto(F).filter(x=>x.d<=dd||cIn(x.d,MKEY))),d=Math.round((v-u)*100)/100;x.textContent=v>0?(Math.abs(d)<0.01?'Bate com as compras lançadas.':(d>0?'A fatura veio '+brl(d)+' maior: entra como ajuste (juros, tarifas ou compras não lançadas).':'A fatura veio '+brl(-d)+' menor: o ajuste reduz os gastos do mês.')):''}},true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ccdel],[data-ccfat],[data-ccfatx]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();window.__ccOp=true;
  if(b.dataset.ccfatx){UI.ccFat=null;return render(true)}
  if(b.dataset.ccfat){UI.ccFat=b.dataset.ccfat;render(true);setTimeout(()=>{const i=document.getElementById('ccf_v');if(i){i.scrollIntoView({block:'center'});i.focus()}},80);return}
  const id=b.dataset.ccdel,g=cD().gastos.find(x=>x.id===id);if(!g)return;const grp=g.ccg?cD().gastos.filter(x=>x.ccg===g.ccg&&!x.fat):[g];if(!confirm(grp.length>1?'Apagar esta compra e as '+grp.length+' parcelas em aberto?':'Apagar esta compra?'))return;const ids=new Set(grp.map(x=>x.id));cD().gastos=cD().gastos.filter(x=>!ids.has(x.id));save();toast('Compra apagada.');render(true)},true);
document.addEventListener('submit',e=>{const f=e.target;if(!f)return;
  if(f.id==='ccf'){e.preventDefault();e.stopImmediatePropagation();const g=id=>(document.getElementById(id)||{}).value||'',er=t=>{const x=document.getElementById('cc_e');if(x)x.textContent=t},C=CC();
    let card=g('cc_c');if(card==='__novo'||!C.cards.length){const n=g('cc_n').trim();if(n.length<2)return er('Dê um nome ao cartão (ex.: Nubank).');if(C.cards.some(c=>c.n.toLowerCase()===n.toLowerCase()))return er('Já existe um cartão com esse nome.');const fe=parseInt(g('cc_f'))||0;C.cards.push({n,lim:num(g('cc_l'))||0,fecha:fe>=1&&fe<=31?fe:0});card=n}
    const v=num(g('cc_v'));if(!(v>0))return er('Informe o valor da compra.');const t=g('cc_t').trim()||'Compra no cartão',d=/^\d{4}-\d{2}-\d{2}$/.test(g('cc_d'))?g('cc_d'):TODAYISO,P=Math.max(1,Math.min(12,parseInt(g('cc_p'))||1)),cat=autoCat(t,g('cc_g')||'outros'),grp=P>1?uid():'';
    const pv=Math.floor(v/P*100)/100;for(let i=0;i<P;i++){const val=i===P-1?Math.round((v-pv*(P-1))*100)/100:pv;cD().gastos.push({id:uid(),d:addM(d,i),desc:t+(P>1?' ('+(i+1)+'/'+P+')':''),v:val,cat,cc:1,card,...(grp?{ccg:grp}:{})})}
    UI.ccLast=card;save();toast(P>1?'Compra lançada em '+P+' parcelas.':'Compra lançada no cartão.');return render(true)}
  if(f.id==='ccff'){e.preventDefault();e.stopImmediatePropagation();const F=UI.ccFat,C=CC(),v=num((document.getElementById('ccf_v')||{}).value),d=(document.getElementById('ccf_d')||{}).value||TODAYISO;if(!(v>0)){const x=document.getElementById('ccf_x');if(x)x.textContent='Informe o valor da fatura.';return}
    const L=aberto(F).filter(x=>x.d<=d||cIn(x.d,MKEY)),comp=sum(L),dif=Math.round((v-comp)*100)/100,fid=uid();L.forEach(x=>x.fat=fid);
    if(Math.abs(dif)>=0.01)cD().gastos.push({id:uid(),d,desc:'Ajuste da fatura '+F,v:dif,cat:'outros',cc:1,card:F,fat:fid,ccAdj:1});
    C.fat.push({id:fid,card:F,v,d,comp,dif});UI.ccFat=null;save();toast('Fatura lançada. As compras saíram da lista em aberto.');return render(true)}
},true);
})();
</script>
