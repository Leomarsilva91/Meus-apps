/* ---------- cálculos do MEI ---------- */
const yearOf=d=>d.slice(0,4);
function meiCalc(){
  const m=S.mei,revY=m.rev.filter(r=>yearOf(r.d)==Y),expY=m.exp.filter(r=>yearOf(r.d)==Y);
  const tot=revY.reduce((a,r)=>a+r.v,0),totExp=expY.reduce((a,r)=>a+r.v,0);
  let lim=REF.limite,prop=false;
  if(m.open&&m.open.slice(0,4)==String(Y)){const mo=+m.open.slice(5,7);lim=REF.limMes*(12-mo+1);prop=true}
  if(m.porte==='me'||m.porte==='epp'){const A=m.porte==='me'?REF.limME:REF.limEPP;lim=A;prop=false;if(m.open&&m.open.slice(0,4)==String(Y)){lim=A/12*(12-(+m.open.slice(5,7))+1);prop=true}}
  const el=M+TODAY.getDate()/new Date(Y,M+1,0).getDate(),avg=el>0?tot/el:0,left=Math.max(0,12-el);
  const pct=lim?tot/lim*100:0,room=lim-tot;
  const byM=Array.from({length:12},(_,i)=>({r:0,e:0}));
  revY.forEach(r=>byM[+r.d.slice(5,7)-1].r+=r.v);expY.forEach(r=>byM[+r.d.slice(5,7)-1].e+=r.v);
  let fol=0;flD().pag.forEach(g=>{if(String(g.mes).slice(0,4)===String(Y)){const i=+g.mes.slice(5,7)-1,v=(+g.base||0)+(+g.extra||0);if(i>=0&&i<12){byM[i].e+=v;fol+=v}}});
  retD().forEach(x=>{if(/Pró-labore/.test(x.t||'')&&String(x.d).slice(0,4)===String(Y)){const i=+x.d.slice(5,7)-1,v=+x.v||0;if(i>=0&&i<12){byM[i].e+=v;fol+=v}}});
  return{tot,totExp:totExp+fol,fol,lim,prop,avg,left,pct,room,proj:avg*12,perMonthLeft:left>0?Math.max(0,room)/left:0,byM,lucroMes:byM[M].r-byM[M].e,
    lucro3:[1,2,3].map(k=>M-k).filter(i=>i>=0).map(i=>byM[i].r-byM[i].e)}
}
function dasList(){
  const m=S.mei,val=REF.das[m.act]||REF.das.serv,out=[];
  for(let i=0;i<=M;i++){const key=Y+'-'+pad(i+1),due=new Date(Y,i+1,20),dueIso=iso(due),paid=!!m.das[key],d=daysTo(dueIso);
    out.push({key,i,due:dueIso,d,paid,val,st:paid?'paga':d<0?'atrasada':d<=10?'vence':'aberta'})}
  return out;
}
function meiAlerts(){
  const c=meiCalc(),L=dasList(),a=[];
  if(!isMei()){if(c.pct>=80)a.push({k:c.pct>=100?'bad':'warn',t:c.pct>=100?'Você passou do limite do Simples':'Você usou '+Math.round(c.pct)+'% do limite',d:'Sobram '+brl0(c.room)+' até dezembro.',go:['negocio','resumo']});return a}
  const late=L.filter(x=>x.st==='atrasada');if(late.length)a.push({k:'bad',t:late.length+(late.length>1?' guias em atraso':' guia em atraso'),d:'Gere a guia atualizada no Portal do Empreendedor e pague. Atraso gera multa e juros.',go:['negocio','guia']});
  const nx=L.filter(x=>!x.paid&&x.d>=0).sort((p,q)=>p.d-q.d)[0];if(nx)a.push({k:nx.d<=7?'warn':'info',t:'Guia de '+MES[nx.i]+' vence dia '+fd(nx.due).slice(0,5),d:nx.d===0?'Vence hoje.':'Faltam '+nx.d+' dias. Valor de referência: '+brl(nx.val)+'.',go:['negocio','guia']});
  if(c.pct>=80)a.push({k:c.pct>=100?'bad':'warn',t:c.pct>=100?'Você passou do limite do MEI':'Você usou '+Math.round(c.pct)+'% do limite',d:c.pct>=100?'Veja o que acontece quando passa do limite.':'Sobram '+brl0(c.room)+' até dezembro.',go:['negocio','resumo']});
  return a;
}

const TIPOS={cartao:'Cartão de crédito',banco:'Banco ou empréstimo',loja:'Loja ou crediário',financiamento:'Financiamento (com bem)',conta:'Conta de consumo (luz, água, telefone)',outro:'Outra'};
const eff=d=>d.acordo?{...d,saldo:d.acordo.total,juros:0,min:d.acordo.total/d.acordo.parc}:d;
function order(debts,metodo){
  const L=debts.map(eff).filter(d=>d.saldo>0.005);
  const av=(a,b)=>b.juros-a.juros;
  if(metodo==='snow')return L.sort((a,b)=>a.saldo-b.saldo);
  if(metodo==='aval')return L.sort(av);
  return L.sort((a,b)=>(b.ess-a.ess)||av(a,b));
}
function sim(debts,budget,metodo){
  const ord=order(debts,metodo),bal={};ord.forEach(d=>bal[d.id]=d.saldo);
  let m=0,juros=0;const end={};
  while(m<600&&ord.some(d=>bal[d.id]>0.005)){
    m++;ord.forEach(d=>{if(bal[d.id]>0){const i=bal[d.id]*d.juros/100;bal[d.id]+=i;juros+=i}});
    let left=budget;
    ord.forEach(d=>{if(bal[d.id]>0){const p=Math.min(d.min||0,bal[d.id],left);bal[d.id]-=p;left-=p}});
    ord.forEach(d=>{if(left>0&&bal[d.id]>0){const p=Math.min(bal[d.id],left);bal[d.id]-=p;left-=p}});
    ord.forEach(d=>{if(bal[d.id]<=0.005&&end[d.id]==null)end[d.id]=m});
  }
  return{ord,months:m,ok:m<600,juros,end};
}
const monthAfter=n=>{const d=new Date(Y,M+n,1);return MES[d.getMonth()]+' de '+d.getFullYear()};
function why(d){
  d=eff(d);const r=[];
  if(d.ess)r.push('Serviço essencial: atrasar pode levar ao corte.');
  if(d.tipo==='financiamento'&&d.atraso>0)r.push('Tem um bem como garantia (pode ser retomado).');
  if(d.juros>=8)r.push('Juros altos: '+String(d.juros).replace('.',',')+'% ao mês.');
  else if(d.juros>=4)r.push('Juros médios: '+String(d.juros).replace('.',',')+'% ao mês.');
  if(d.neg)r.push('Está com o nome negativado.');
  if(d.atraso>60)r.push('Atrasada há '+d.atraso+' dias.');
  if(!r.length)r.push('Sem urgência especial.');
  return r.join(' ');
}

function chart(c){
  const W=340,H=150,pl=34,pb=18,pt=8,mx=Math.max(1,...c.byM.map(b=>Math.max(b.r,b.e)))*1.1,bw=(W-pl)/12;
  const y=v=>pt+(H-pb-pt)*(1-v/mx),ticks=[0,.5,1].map(f=>mx*f/1.1);
  let g=ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t/1000)+' mil':Math.round(t)}</text>`).join('');
  c.byM.forEach((b,i)=>{const x=pl+i*bw;g+=`<rect x="${x+3}" y="${y(b.r)}" width="${bw/2-3}" height="${Math.max(0,H-pb-y(b.r))}" rx="2" fill="var(--mei)"/><rect x="${x+bw/2}" y="${y(b.e)}" width="${bw/2-3}" height="${Math.max(0,H-pb-y(b.e))}" rx="2" fill="var(--muted)" opacity=".55"/><text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${MS[i][0].toUpperCase()}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês em ${Y}">${g}</svg><div class="row small muted"><span><b style="color:var(--mei)">■</b> Receitas</span><span><b style="color:var(--muted)">■</b> Despesas</span></div>`;
}

const gPend=g=>g.tipo==='viagem'&&!(g.alvo>0),gOpen=g=>gPend(g)||g.guardado<g.alvo;
function gcalc(g){const falta=Math.max(0,g.alvo-g.guardado),pct=g.alvo?Math.min(100,g.guardado/g.alvo*100):0,dias=daysTo(g.prazo),meses=Math.max(1,Math.ceil(dias/30.44));

function orcProj(pl){
  const D0=pl.D.map(d=>({...d})),ids=order(S.debts,S.metodo).map(d=>d.id),d0=D0.reduce((a,d)=>a+d.saldo,0),sv0=S.goals.reduce((a,g)=>a+g.guardado,0);

(function(){var PT=null;
function say(m){var e=document.getElementById('paste-toast');if(!e){e=document.createElement('div');e.id='paste-toast';e.setAttribute('role','status');e.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;border-radius:12px;padding:10px 16px;z-index:99999;max-width:92vw;font:14px system-ui,sans-serif';document.body.appendChild(e)}e.textContent=m;e.hidden=false;clearTimeout(say.h);say.h=setTimeout(function(){e.hidden=true},3200)}

function put(inp,file){try{var dt=new DataTransfer();if(inp.multiple)[].slice.call(inp.files||[]).forEach(function(f){dt.items.add(f)});dt.items.add(file);inp.files=dt.files;inp.dispatchEvent(new Event('change',{bubbles:true}));return true}catch(_){return false}}
document.addEventListener('paste',function(e){if(!PT||Date.now()-PT.t>90000)return;var it=[].slice.call((e.clipboardData&&e.clipboardData.items)||[]).filter(function(x){return x.kind==='file'&&/^image\//.test(x.type)})[0];if(!it)return;var f=it.getAsFile();if(!f)return;e.preventDefault();var inp=PT.inp;PT=null;if(put(inp,new File([f],'imagem-colada.'+(f.type.split('/')[1]||'png'),{type:f.type})))say('Imagem colada.')});

 var rd=navigator.clipboard&&navigator.clipboard.read;if(!rd){say('Agora cole a imagem: no computador use Ctrl+V; no celular, toque e segure e escolha Colar.');return}

try{note()}catch(e){}

  ALL.forEach(d=>{if(d.uid!==u&&d.nick&&!b.includes(d.uid))o.set(d.uid,d.nick)});return [...o].map(([uid,nick])=>({uid,nick})).sort((a,b)=>a.nick.localeCompare(b.nick))}

  if(k.startsWith('g:')){const g=grp(k.slice(2));if(!g)return[];const b=blk(),o=[];g.mem.forEach(m=>{if(m!==u&&b.includes(m))return;(doc(m).m||[]).forEach(x=>{if(x.to===k)o.push({...x,from:m})})});return o.sort(by)}
  const p=k.slice(2),b=blk();return [...(doc(u).m||[]).filter(x=>x.to===p).map(x=>({...x,from:u})),...(b.includes(p)?[]:(doc(p).m||[]).filter(x=>x.to===u).map(x=>({...x,from:p})))].sort(by)}

  (doc(u).m||[]).forEach(x=>{if(!String(x.to).startsWith('g:'))ks.add('u:'+x.to)});
  ALL.forEach(d=>{if(d.uid!==u&&!b.includes(d.uid)&&(d.m||[]).some(x=>x.to===u))ks.add('u:'+d.uid)});

  const s=seen();return [...ks].map(k=>{const L=msgs(k),last=L[L.length-1],un=L.filter(x=>x.from!==u&&String(x.ts)>String(s[k]||'')).length;
    return {k,last,un,ts:last?last.ts:(k.startsWith('g:')?((grp(k.slice(2))||{}).ts||''):'')}}).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))}

  <input class="dmx-in" id="dmx_q" placeholder="Procurar apelido" value="${e(Q)}" autocomplete="off"><div id="dmx_pl">${pickList(GSEL,'many')}</div>
  <div class="dmx-err" role="alert">${e(ERR)}</div>
  <button type="button" class="dmx-btn" data-dmx="gcreate">Criar grupo</button>
  <span class="dmx-m">Até 30 pessoas. Você será o dono do grupo e pode adicionar ou tirar pessoas.</span></div><div></div>`}
function bubbles(k){const u=me(),L=msgs(k),g=k.startsWith('g:');let lastDay='';
  if(!L.length)return `<div class="dmx-note" style="align-self:center;text-align:center">${g?'Grupo criado. Mande a primeira mensagem.':'Mande a primeira mensagem para '+e(title(k))+'.'}</div>`;
  return L.map(x=>{let d='';try{d=new Date(x.ts).toLocaleDateString('pt-BR')}catch(_){}const day=d!==lastDay?`<span class="dmx-day">${e(d)}</span>`:'';lastDay=d;
    const mine=x.from===u;return day+`<div class="dmx-b${mine?' me':''}">${g&&!mine?`<span class="who">${e(nickOf(x.from))}</span>`:''}<span>${e(x.txt)}</span><span class="t">${hm(x.ts).split(' ').pop()}</span></div>`}).join('')}
function partsV(k){const g=grp(k.slice(2));if(!g)return '';const u=me(),own=g.own===u;
  const L=g.mem.map(m=>`<div class="dmx-pick" style="cursor:default"><span class="dmx-av" style="width:32px;height:32px">${ini(nickOf(m))}</span><span style="flex:1">${e(nickOf(m))}${m===g.own?' <span class="dmx-m">(dono)</span>':''}</span>${own&&m!==u&&(g.base||[]).includes(m)?`<button type="button" class="dmx-chip" data-dmrm="${e(m)}">Tirar</button>`:''}</div>`).join('');
  const add=own?`<button type="button" class="dmx-chip" data-dmx="addp">${ADDP?'Fechar lista':'+ Adicionar pessoas'}</button>${ADDP?`<input class="dmx-in" id="dmx_q" placeholder="Procurar apelido" value="${e(Q)}" autocomplete="off"><div id="dmx_pl">${addList(g)}</div>`:''}`:'';
  return `<div class="dmx-sec"><button type="button" class="h" data-dmx="parts" aria-expanded="${PP}">Participantes (${g.mem.length})</button>${PP?`<div class="dmx-pl">${L}</div>${add}<div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${String(g.id).startsWith('ms')?'<span class="dmx-m">Grupo da meta compartilhada: entra quem usa o código da meta.</span>':own?'<button type="button" class="dmx-chip" data-dmx="gdel">Apagar o grupo</button>':'<button type="button" class="dmx-chip" data-dmx="gleave">Sair do grupo</button>'}</div>`:''}</div>`}
function addList(g){const q=Q.trim().toLowerCase(),L=people().filter(p=>!g.mem.includes(p.uid)&&(!q||p.nick.toLowerCase().includes(q)));
  return L.length?'<div class="dmx-pl">'+L.map(p=>`<div class="dmx-pick" style="cursor:default"><span class="dmx-av" style="width:32px;height:32px">${ini(p.nick)}</span><span style="flex:1">${e(p.nick)}</span><button type="button" class="dmx-chip" data-dmadd="${e(p.uid)}">Adicionar</button></div>`).join('')+'</div>':'<span class="dmx-m">Ninguém para adicionar.</span>'}
function chatV(){const k=CUR,g=k.startsWith('g:'),nick=nickGet(),b=blkMsg();
  const extra=g?partsV(k):`<div class="dmx-sec"><button type="button" class="h" data-dmx="parts" aria-expanded="${PP}">Opções da conversa</button>${PP?`<button type="button" class="dmx-chip" data-dmx="block" style="justify-self:start">Bloquear ${e(title(k))}</button><span class="dmx-m">Bloquear esconde as mensagens dessa pessoa neste aparelho.</span>`:''}</div>`;
  const comp=b?`<div class="dmx-comp"><span class="dmx-m">${e(b)}</span></div>`:`<div class="dmx-comp">${nick?'':`<input class="dmx-in" id="dmx_n" maxlength="20" placeholder="Seu apelido (3 a 20 letras)" autocomplete="off">`}
   <div class="dmx-err" id="dmx_e" role="alert"></div>
   <div class="r"><textarea class="dmx-in" id="dmx_t" rows="1" maxlength="300" placeholder="Escreva uma mensagem"></textarea><button type="button" class="dmx-btn" data-dmx="send" aria-label="Enviar">Enviar</button></div>
   <span class="dmx-m">Particular${g?' do grupo':''}: não vai para a timeline. Sem telefone, links ou ofensas.</span></div>`;
  return top(title(k))+`<div class="dmx-body" id="dmx_body"><div id="dmx_x">${extra}</div><div class="dmx-note">Só ${g?'quem está no grupo':'vocês dois'} veem estas mensagens.</div><div id="dmx_msgs" style="display:flex;flex-direction:column;gap:6px">${bubbles(k)}</div></div>`+comp}
function markSeen(){if(V!=='chat'||!CUR)return;const L=msgs(CUR),l=L[L.length-1];if(!l)return;const s=seen();if(String(s[CUR]||'')<String(l.ts)){s[CUR]=l.ts;LSs(P()+'_seen',s)}}
function draw(full){const x=el();if(!V){x.hidden=true;document.body.style.overflow='';badge();return}
  setColors();x.hidden=false;document.body.style.overflow='hidden';
  const a=document.activeElement,inside=a&&x.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName);
  if(V==='chat'&&!full&&document.getElementById('dmx_msgs')){const b=document.getElementById('dmx_body'),near=b.scrollHeight-b.scrollTop-b.clientHeight<120;
    document.getElementById('dmx_msgs').innerHTML=bubbles(CUR);if(!(inside&&a.id==='dmx_q'))document.getElementById('dmx_x').innerHTML=CUR.startsWith('g:')?partsV(CUR):document.getElementById('dmx_x').innerHTML;
    if(near)b.scrollTop=b.scrollHeight;markSeen();badge();return}

  if(V==='chat'){const b=document.getElementById('dmx_body');b.scrollTop=b.scrollHeight;markSeen()}
  badge()}
function go(v,k){V=v;if(k!==undefined)CUR=k;PP=false;ADDP=false;Q='';ERR='';if(v==='group'){GSEL=new Set();GN=''}draw(true);
  if(v==='chat'){const t=document.getElementById('dmx_t');if(t&&matchMedia('(min-width:700px)').matches)t.focus()}}
function close(){V=null;CUR=null;FORCE=false;draw(true)}
function ready(){if(!db()||!me()){toast('O bate-papo precisa da sua conta. Ele não está ativo agora.');return false}if(!on()&&!FORCE){toast('A Comunidade está fechada no momento.');return false}const b=blkMsg();if(b){toast(b);return false}return true}
function put(patch){if(!LOADED)return Promise.reject(new Error('loading'));const u=me(),d=doc(u),v={nick:d.nick||nickGet()||'',m:d.m||[],g:d.g||[],left:d.left||[],...patch};
  const i=ALL.findIndex(x=>x.uid===u);if(i>=0)ALL[i]={uid:u,...v};else ALL.push({uid:u,...v});
  return db().collection('dm').doc(u).set(v)}
const CONTACT=/\d{8,}|@|https?:|www\./i;
function check(t){const bad=K().bad,bad2=K().bad2;
  if(CONTACT.test(t.replace(/[\s.\-()]/g,'')))return 'Por segurança, não passe telefone, e-mail ou links por aqui.';
  if(bad&&bad.test(t))return 'Retire ofensas ou palavrões.';
  if(bad2&&bad2.test(t))return K().bad2msg||'Essa mensagem não pode ser enviada.';return ''}
function send(){const er=s=>{const x=document.getElementById('dmx_e');if(x)x.textContent=s};const ta=document.getElementById('dmx_t');if(!ta)return;
  const txt=ta.value.trim().replace(/[ \t]+/g,' ');if(!txt)return;if(!ready())return;
  let nick=nickGet();const ni=document.getElementById('dmx_n');if(!nick&&ni){nick=ni.value.trim().replace(/\s+/g,' ');if(nick.length<3||nick.length>20)return er('Escolha um apelido de 3 a 20 letras.');const c=check(nick);if(c)return er(c);nickSet(nick)}
  const c=check(txt);if(c)return er(c);
  if(Date.now()-T<1500)return er('Calma, aguarde um instante.');
  if(CUR.startsWith('u:')&&blk().includes(CUR.slice(2)))return er('Você bloqueou essa pessoa.');
  if(CUR.startsWith('g:')&&!grp(CUR.slice(2)))return er('Esse grupo não existe mais.');
  er('');T=Date.now();const to=CUR.startsWith('g:')?CUR:CUR.slice(2);
  const it={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),to,txt:txt.slice(0,300),ts:new Date().toISOString()};
  const old=ta.value;ta.value='';ta.style.height='';
  put({nick:nick||doc(me()).nick||'',m:[...(doc(me()).m||[]),it].slice(-400)}).then(()=>{draw(false)}).catch(()=>{T=0;ta.value=old;const d=doc(me());d.m=(d.m||[]).filter(x=>x.id!==it.id);er('Não foi possível enviar agora.');draw(false)});
  if(ni)draw(true);else draw(false)}
function myGroups(){return (doc(me()).g||[]).slice()}
function gCreate(){const n=(document.getElementById('dmx_gn')||{}).value||GN;GN=n;const name=n.trim().replace(/\s+/g,' ');
  if(!ready())return;if(name.length<3)return ERR='Dê um nome de 3 a 30 letras ao grupo.',draw(true);
  const c=check(name);if(c)return ERR=c,draw(true);if(!GSEL.size)return ERR='Escolha pelo menos uma pessoa.',draw(true);if(GSEL.size>29)return ERR='O grupo pode ter até 30 pessoas.',draw(true);
  if(myGroups().length>=20)return ERR='Você já tem 20 grupos. Apague um para criar outro.',draw(true);
  if(!nickGet()){const nk=prompt('Seu apelido no bate-papo (3 a 20 letras):','')||'';const v=nk.trim();if(v.length<3||v.length>20||check(v))return ERR='Escolha um apelido de 3 a 20 letras.',draw(true);nickSet(v)}
  const g={id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name.slice(0,30),mem:[...GSEL],ts:new Date().toISOString()};
  put({nick:nickGet()||doc(me()).nick||'',g:[...myGroups(),g]}).then(()=>{toast('Grupo criado.')}).catch(()=>toast('Não foi possível criar o grupo agora.'));go('chat','g:'+g.id)}
function gEdit(fn,msg){const id=CUR.slice(2),L=myGroups(),i=L.findIndex(x=>x.id===id);if(i<0)return;const r=fn(L[i],L,i);put({g:r}).then(()=>msg&&toast(msg)).catch(()=>toast('Não foi possível agora.'));draw(true)}

document.addEventListener('click',ev=>{
  if(ev.target.id==='dmx'){close();return}
  const t=ev.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.dml!==undefined){if(!ready())return;go('list');return}
  if(D.dmo){if(!ready())return;if(D.dmo===me())return;go('chat','u:'+D.dmo);return}
  if(D.dmk){go('chat',D.dmk);return}
  if(D.dmrm){gEdit((g,L,i)=>{L[i]={...g,mem:(g.mem||[]).filter(x=>x!==D.dmrm)};return L},'Pessoa retirada do grupo.');return}
  if(D.dmadd){gEdit((g,L,i)=>{const m=[...new Set([...(g.mem||[]),D.dmadd])];if(m.length>29){toast('O grupo pode ter até 30 pessoas.');return L}L[i]={...g,mem:m};return L},'Pessoa adicionada.');return}
  const a=D.dmx;if(!a)return;
  if(a==='close')return close();
  if(a==='back'){if(V==='list')return close();return go('list')}
  if(a==='new')return go('new');
  if(a==='group')return go('group');
  if(a==='gcreate')return gCreate();
  if(a==='send')return send();
  if(a==='parts'){PP=!PP;ADDP=false;Q='';return draw(true)}
  if(a==='addp'){ADDP=!ADDP;Q='';return draw(true)}
  if(a==='block'){const p=CUR.slice(2);if(!confirm('Bloquear '+title(CUR)+'? As mensagens dessa pessoa somem deste aparelho.'))return;LSs(P()+'_blk',[...new Set([...blk(),p])]);toast('Pessoa bloqueada.');return go('list')}
  if(a==='gleave'){if(!confirm('Sair do grupo '+title(CUR)+'?'))return;const id=CUR.slice(2);put({left:[...new Set([...(doc(me()).left||[]),id])].slice(-100)}).then(()=>toast('Você saiu do grupo.')).catch(()=>toast('Não foi possível sair agora.'));return go('list')}
  if(a==='gdel'){if(!confirm('Apagar o grupo '+title(CUR)+' para todos?'))return;const id=CUR.slice(2);put({g:myGroups().filter(x=>x.id!==id),m:(doc(me()).m||[]).filter(x=>x.to!=='g:'+id)}).then(()=>toast('Grupo apagado.')).catch(()=>toast('Não foi possível apagar agora.'));return go('list')}
},true);
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.dataset&&t.dataset.dmp){t.checked?GSEL.add(t.dataset.dmp):GSEL.delete(t.dataset.dmp);const gn=document.getElementById('dmx_gn');if(gn)GN=gn.value;const b=document.querySelector('#dmx .dmx-body>b');if(b)b.textContent='Quem vai participar ('+GSEL.size+' escolhida'+(GSEL.size===1?'':'s')+')'}});
document.addEventListener('input',ev=>{const t=ev.target;if(!t)return;
  if(t.id==='dmx_q'){Q=t.value;const pl=document.getElementById('dmx_pl');if(pl){if(V==='new')pl.innerHTML=pickList(null,'one');else if(V==='group')pl.innerHTML=pickList(GSEL,'many');else if(V==='chat'){const g=grp(CUR.slice(2));if(g)pl.innerHTML=addList(g)}}}
  if(t.id==='dmx_gn')GN=t.value;
  if(t.id==='dmx_t'){t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px'}});
document.addEventListener('keydown',ev=>{if(ev.target&&ev.target.id==='dmx_t'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&matchMedia('(hover:hover)').matches){ev.preventDefault();send()}
  if(ev.key==='Escape'&&V){close()}});

function start(){if(SUB)return;const d=db();if(!d||!me())return;SUB=true;
  try{d.collection('dm').onSnapshot(sn=>{ALL=sn.docs.map(x=>{const v=x.data()||{};return {uid:x.id,nick:typeof v.nick==='string'?v.nick.slice(0,20):'',m:Array.isArray(v.m)?v.m.filter(m=>m&&typeof m.txt==='string'&&typeof m.to==='string').map(m=>({id:String(m.id||''),to:m.to,txt:m.txt.slice(0,300),ts:String(m.ts||'')})):[],g:Array.isArray(v.g)?v.g.filter(g=>g&&typeof g.id==='string').map(g=>({id:g.id,name:String(g.name||'Grupo').slice(0,30),mem:Array.isArray(g.mem)?g.mem.filter(x=>typeof x==='string').slice(0,30):[],ts:String(g.ts||'')})):[],left:Array.isArray(v.left)?v.left.filter(x=>typeof x==='string'):[]}});LOADED=true;
    if(V)draw(false);else badge()},()=>{SUB=false})}catch(_){SUB=false}}
const iv=setInterval(()=>{start();if(SUB)clearInterval(iv)},1200);

window.DM={
  btn:(uid)=>{if(!uid||uid===me()||!db()||!me()||!on()||blkMsg())return '';return `<button class="${chip()}" type="button" data-dmo="${e(uid)}">💬 Conversar</button>`},
  head:()=>{if(!db()||!me()||!on()||blkMsg())return '';const n=unread();return `<button class="${chip()}" type="button" data-dml="1" style="font-weight:700">💬 Conversas e grupos <span class="dmx-n" data-dmbadge ${n?'':'hidden'}>${n||''}</span></button>`},
  unread,open:()=>{if(ready())go('list')},
  openKey:k=>{FORCE=true;if(!ready()){FORCE=false;return}if(k.startsWith('g:')&&!grp(k.slice(2))){FORCE=false;toast(LOADED?'A conversa do grupo ainda não está pronta. Tente de novo em instantes.':'Carregando as conversas, tente de novo em instantes.');return}go('chat',k)},
  ensureGroup:(id,name)=>{if(!db()||!me())return Promise.reject(new Error('off'));const tryIt=n=>LOADED?Promise.resolve():n>0?new Promise(r=>setTimeout(r,800)).then(()=>tryIt(n-1)):Promise.reject(new Error('loading'));
    return tryIt(15).then(()=>{const L=myGroups(),i=L.findIndex(x=>x.id===id),nm=String(name||'Grupo').slice(0,30);if(i>=0&&L[i].name===nm)return;if(i>=0)L[i]={...L[i],name:nm};else L.push({id,name:nm,mem:[],ts:new Date().toISOString()});return put({nick:doc(me()).nick||nickGet()||'',g:L})})},
  dropGroup:id=>{if(!db()||!me()||!LOADED)return Promise.reject(new Error('off'));return put({g:myGroups().filter(x=>x.id!==id),m:(doc(me()).m||[]).filter(x=>x.to!=='g:'+id)})}

<script>
/* ---- Metas compartilhadas: o grupo vê a mesma meta, avisa "paguei" e conversa num grupo próprio ---- */
(function(){
const MS={own:{},joins:[],sub:false,ok1:false,ok2:false,tm:null,T:0};
const db=()=>PT.db,me=()=>PT.uid,kid=()=>typeof VIS!=='undefined'&&VIS&&VIS.kid;
const nickG=()=>{try{return localStorage.getItem('prumo_nick')||''}catch(_){return''}},nickS=n=>{try{localStorage.setItem('prumo_nick',n)}catch(_){}};
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',mkCode=()=>Array.from({length:6},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
const BAD=/\d{8,}|@|https?:|www\./i;
const r2=v=>Math.round((+v||0)*100)/100;
const entries=()=>{const o=[];Object.keys(MS.own).forEach(u=>(MS.own[u].L||[]).forEach(x=>o.push({...x,own:u,ownNick:MS.own[u].nick||'Usuário'})));return o};
const byCode=c=>entries().find(x=>x.code===c);
const myOwn=()=>((MS.own[me()]||{}).L||[]).slice();
const myJ=()=>MS.joins.find(j=>j.uid===me())||{uid:me(),nick:'',codes:[],pay:[],who:{}};
const joinersOf=c=>MS.joins.filter(j=>(j.codes||[]).includes(c)&&j.uid!==((byCode(c)||{}).own));
const paysOf=c=>{const o=[];joinersOf(c).forEach(j=>(j.pay||[]).forEach(p=>{if(p.code===c)o.push({...p,from:j.uid,nick:j.nick||'Usuário'})}));return o.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))};
const shareOf=g=>myOwn().find(x=>x.gid===g.id);
const ready=()=>!!db()&&!!me();
window.MSX={extra:(owner,code)=>{const e=((MS.own[owner]||{}).L||[]).find(x=>x.code===code);return e?joinersOf(code).map(j=>j.uid):[]},
  people:()=>MS.joins.filter(j=>j.nick).map(j=>({uid:j.uid,nick:j.nick}))};

function snap(g,prev){let total=+g.alvo||0,mem=[];
  try{const pt=planTotals(g).total;if(g.tipo==='viagem'||!(total>0))total=pt>0?pt:total}catch(_){}
  try{if(g.tipo==='viagem'&&(g.membros||[]).length){const {f}=memShare(g);mem=g.membros.map(m=>({id:String(m.id||''),n:String(m.nome||'').slice(0,30),p:r2(f(m)),gu:r2(m.guardado)}))}}catch(_){}
  return {...(prev||{}),gid:g.id,nome:String(g.nome||'Meta').slice(0,60),tipo:g.tipo||'outro',prazo:g.prazo||'',total:r2(total),gu:r2(g.guardado),mem:mem.slice(0,40)}}
function pushOwn(L){return db().collection('msh').doc(me()).set({nick:nickG()||'',L:L.slice(0,20)})}
function sync(){if(!ready()||!MS.ok1||S.demo)return;const L=myOwn();if(!L.length)return;let ch=false;
  const N=L.map(x=>{const g=S.goals.find(y=>y.id===x.gid);if(!g){ch=true;return null}const s=snap(g,x);if(JSON.stringify(s)!==JSON.stringify(x))ch=true;return s}).filter(Boolean);
  if(ch)pushOwn(N).catch(()=>{})}
const later=()=>{clearTimeout(MS.tm);MS.tm=setTimeout(sync,1500)};
if(typeof docKind==='function'){const _dk=docKind;docKind=function(){if(UI.tab==='metas'&&UI.msv)return null;return _dk.apply(this,arguments)}}
if(typeof save==='function'){const _s=save;save=function(){const r=_s.apply(this,arguments);try{later()}catch(_){}return r}}
const rr=()=>{if(UI.tab!=='metas')return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render(true)};
function start(){if(MS.sub||!ready())return;MS.sub=true;
  db().collection('msh').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{const v=d.data()||{};o[d.id]={nick:String(v.nick||'').slice(0,20),L:Array.isArray(v.L)?v.L.filter(x=>x&&typeof x.code==='string').slice(0,20):[]}});MS.own=o;if(!MS.ok1){MS.ok1=true;later()}rr()},()=>{MS.sub=false});
  db().collection('mshj').onSnapshot(sn=>{MS.joins=sn.docs.map(d=>{const v=d.data()||{};return {uid:d.id,nick:String(v.nick||'').slice(0,20),codes:Array.isArray(v.codes)?v.codes.filter(x=>typeof x==='string').slice(0,20):[],pay:Array.isArray(v.pay)?v.pay.filter(p=>p&&typeof p.code==='string'&&+p.v>0).slice(-200):[],who:v.who&&typeof v.who==='object'&&!Array.isArray(v.who)?v.who:{}}});MS.ok2=true;rr()},()=>{})}
const iv=setInterval(()=>{start();if(MS.sub)clearInterval(iv)},1200);

/* ---------- telas ---------- */
const nickField=id=>nickG()?'':`<label>Seu apelido para o grupo (3 a 20 letras)<input id="${id}" maxlength="20" autocomplete="off" placeholder="Ex.: Leo"></label>`;
const ST={ok:['Confirmado','ok'],no:['Não confirmado','bad']};
function ownerCard(g){
  if(kid())return '';
  const head='<h3>👥 Compartilhar com o grupo</h3>';
  if(S.demo)return `<div class="card" id="ms-card">${head}<p class="muted small">Compartilhar funciona com as suas próprias metas. Toque em "Começar do zero" lá em cima e crie a sua.</p></div>`;

document.addEventListener('change',e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.mct)return;const g=S.goals.find(x=>x.id===UI.plan);if(!g)return;const m=(g.membros||[]).find(x=>x.id===t.dataset.mct);if(!m)return;m.ct=t.value.trim().slice(0,80);save()},true);
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='ms-inv')UI.invO=e.target.open},true);
/* ---------- ações ---------- */
function ensureNick(id,er){let n=nickG();if(n)return n;const el=document.getElementById(id);n=el?el.value.trim().replace(/\s+/g,' '):'';
  if(n.length<3||n.length>20){er('Escolha um apelido de 3 a 20 letras.');return null}if(BAD.test(n.replace(/[\s.\-]/g,''))){er('O apelido não pode ter telefone, e-mail ou link.');return null}nickS(n);return n}
function putJ(patch){const j=myJ(),v={nick:j.nick||nickG()||'',codes:j.codes||[],pay:j.pay||[],who:j.who||{},...patch};
  const i=MS.joins.findIndex(x=>x.uid===me());if(i>=0)MS.joins[i]={uid:me(),...v};else MS.joins.push({uid:me(),...v});
  return db().collection('mshj').doc(me()).set(v)}
document.addEventListener('click',e=>{
  const tb=e.target.closest('button[data-tab],button[data-go]');if(tb){UI.msv=null}
  const b=e.target.closest('button[data-ms]');if(!b)return;e.stopImmediatePropagation();e.preventDefault();const a=b.dataset.ms,c=b.dataset.c;
  if(a==='savenow'){doSave();return}
  if(a==='whoedit'){UI.whoE=true;return render(true)}
  if(a==='goinv'){UI.gbo=UI.gbo||{};UI.gbo.pes=true;UI.invO=true;render(true);setTimeout(()=>{const k=document.getElementById('ms-inv');if(k)k.scrollIntoView({block:'start',behavior:'smooth'})},80);return}
  if(a==='shch'){const x=byCode(c),g=S.goals.find(q=>q.id===b.dataset.g);if(!x)return;const raw=((document.getElementById('ms-to')||{}).value||'').trim(),to=ctOf(raw),ch=b.dataset.ch;
    if(raw&&!to)return toast('Confira o WhatsApp (com DDD) ou o e-mail.');
    if(to&&ch!=='copy'&&ch!=='more'&&!(ch===to.t||(ch==='sms'&&to.t==='wa'))){return toast(to.t==='wa'?'Você digitou um telefone: use WhatsApp ou SMS.':'Você digitou um e-mail: use o botão E-mail.')}
    sendInv(ch,invTxt(x.nome,c,''),to,'Convite: '+x.nome+' no Prumo');if(ch==='copy')toast('Convite copiado. Cole no WhatsApp, e-mail ou onde quiser.');else if(ch==='wa')toast('Abrindo o WhatsApp com o convite.');return}
  if(a==='inv'||a==='invall'||a==='invch'){const g=S.goals.find(x=>x.id===b.dataset.g);if(!g)return;const x=shareOf(g);if(!x)return toast('Compartilhe a meta primeiro.');const subj='Convite: '+g.nome+' no Prumo';
    const inp=document.querySelector('[data-mct="'+b.dataset.m+'"]'),M=g.membros||[];
    if(a==='invall'){const box=document.getElementById('msi-all');if(box)box.innerHTML=box.innerHTML?'':invOpts('msi-allo',g.id,'*');return}
    const mid=b.dataset.m,m=M.find(q=>q.id===mid);
    if(a==='inv'){if(!m)return;if(inp){m.ct=inp.value.trim().slice(0,80)}const to=ctOf(m.ct);
      if(to){sendInv(to.t,invTxt(g.nome,x.code,m.nome),to,subj);m.inv=TODAYISO;save();toast(to.t==='wa'?'Abrindo o WhatsApp com o convite.':'Abrindo o e-mail com o convite.');return render(true)}
      if(m.ct&&!to)toast('Contato não reconhecido: escolha por onde mandar.');const box=document.getElementById('msi-'+mid);if(box)box.innerHTML=box.innerHTML?'':invOpts('msi-o'+mid,g.id,mid);return}
    const ch=b.dataset.ch;if(mid==='*'){sendInv(ch,invTxt(g.nome,x.code,''),null,subj);M.forEach(q=>{if(!q.inv)q.inv=TODAYISO});save();if(ch==='copy')toast('Convite copiado. Cole no grupo da família ou mande para cada um.');return setTimeout(()=>render(true),400)}
    if(!m)return;sendInv(ch,invTxt(g.nome,x.code,m.nome),ctOf(m.ct),subj);m.inv=TODAYISO;save();if(ch==='copy')toast('Convite de '+m.nome+' copiado.');return setTimeout(()=>render(true),400)}
  if(a==='back'){UI.msv=null;return render()}
  if(a==='view'){UI.msv=c;return render()}
  if(a==='goto'){UI.plan=b.dataset.g;render();setTimeout(()=>{const k=document.getElementById('ms-card');if(k)k.scrollIntoView({block:'start',behavior:'smooth'})},80);return}
  if(a==='chat'){if(!window.DM||!DM.openKey){toast('A conversa não está disponível agora.');return}const x=byCode(c);if(x&&x.own===me()&&DM.ensureGroup){DM.ensureGroup('ms'+c,x.nome).then(()=>DM.openKey('g:ms'+c)).catch(()=>toast('Carregando as conversas, tente de novo em instantes.'));return}DM.openKey('g:ms'+c);return}
  if(!ready())return toast('Abra o Prumo com a sua conta para usar isto.');
  if(a==='share'){const g=S.goals.find(x=>x.id===b.dataset.g);if(!g||S.demo)return;const er=t=>{const x=document.getElementById('ms-e');if(x)x.textContent=t};
    if(!MS.ok1)return er('Carregando, tente de novo em instantes.');if(shareOf(g))return;if(myOwn().length>=20)return er('Você já compartilha 20 metas. Pare de compartilhar alguma para continuar.');

    pushOwn(L).then(()=>{toast('Meta compartilhada. Mande o código para o grupo.');if(window.DM&&DM.ensureGroup)DM.ensureGroup('ms'+code,g.nome).catch(()=>{})}).catch(()=>{delete MS.own[me()];toast('Não foi possível compartilhar agora.');render(true)});
    return render(true)}
  if(a==='copy'){const x=byCode(c);if(!x)return;copy(invTxt(x.nome,c,''));return}
  if(a==='ok'||a==='no'){const L=myOwn(),i=L.findIndex(x=>x.code===c);if(i<0)return;const p=paysOf(c).find(x=>x.id===b.dataset.p);if(!p)return;const st={...(L[i].st||{})};if(st[p.id])return;st[p.id]=a;

  if(a==='leave'){if(!confirm('Sair desta meta? Você pode entrar de novo com o código.'))return;putJ({codes:(myJ().codes||[]).filter(x=>x!==c)}).then(()=>toast('Você saiu da meta.')).catch(()=>toast('Não foi possível agora.'));UI.msv=null;return render()}
},true);
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='msj'&&f.id!=='msp')return;e.preventDefault();e.stopImmediatePropagation();
  if(f.id==='msj'){const er=t=>{const x=document.getElementById('msj-e');if(x)x.textContent=t};if(!ready())return er('Abra o Prumo com a sua conta.');
    const c=String(document.getElementById('msj-c').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==6)return er('O código tem 6 letras e números.');
    const x=byCode(c);if(!x)return er(MS.ok1?'Não achei esse código. Confira com quem mandou.':'Carregando, tente de novo em instantes.');
    if(x.own===me())return er('Essa meta é sua. Ela já aparece na sua lista.');
    if((myJ().codes||[]).includes(c)){UI.msv=c;return render()}
    if((myJ().codes||[]).length>=20)return er('Você já está em 20 metas compartilhadas. Saia de alguma para entrar nesta.');
    const nk=ensureNick('msj-n',er);if(!nk)return;
    putJ({nick:nk,codes:[...(myJ().codes||[]),c]}).then(()=>toast('Você entrou na meta "'+x.nome+'".')).catch(()=>toast('Não foi possível entrar agora.'));UI.msv=c;return render()}
  const c=f.dataset.c,er=t=>{const x=document.getElementById('msp-e');if(x)x.textContent=t};if(!ready())return er('Abra o Prumo com a sua conta.');
  const v=num(document.getElementById('msp-v').value),note=String(document.getElementById('msp-o').value||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(!(v>0)||v>1e6)return er('Informe o valor que você pagou.');if(note&&BAD.test(note.replace(/[\s.\-]/g,'')))return er('O recado não pode ter telefone, e-mail ou link.');
  if(Date.now()-MS.T<5000)return er('Aguarde alguns segundos.');MS.T=Date.now();
  const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),code:c,v:r2(v),note,ts:new Date().toISOString()};
  putJ({pay:[...(myJ().pay||[]),p].slice(-200)}).then(()=>toast('Aviso enviado. Agora é só esperar a confirmação.')).catch(()=>{MS.T=0;toast('Não foi possível enviar agora.')});render(true)},true);
})();
